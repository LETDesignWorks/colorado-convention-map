<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#0b447e"/>
<title>2027 Colorado Convention Planning Map</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png"/>
<link rel="manifest" href="site.webmanifest"/>
<style>
:root{--navy:#0b447e;--blue:#0b5b9f;--line:#c9d7e5}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#e8eef4}
body{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
.shell{height:100%;display:grid;grid-template-rows:auto 1fr}
.nav{min-height:56px;background:linear-gradient(135deg,#083a6b,#0b5b9f);color:#fff;display:flex;align-items:center;gap:12px;padding:8px 12px;box-shadow:0 2px 10px #0003;z-index:5}
.brand{min-width:0;flex:1}.brand strong{display:block;font-size:16px;line-height:1.15}.brand span{display:block;font-size:11px;opacity:.88;margin-top:2px}
.actions{display:flex;align-items:center;gap:8px}.btn{min-height:38px;border-radius:10px;padding:8px 12px;text-decoration:none;font-weight:800;font-size:12px;display:inline-flex;align-items:center;justify-content:center;white-space:nowrap}.btn.light{background:#ffffff18;color:#fff;border:1px solid #ffffff55}.btn.primary{background:#fff;color:var(--navy);border:1px solid #fff}
.frame-wrap{min-height:0;position:relative}.frame{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
@media(max-width:620px){.nav{min-height:54px;padding:7px 8px;gap:7px}.brand strong{font-size:13px}.brand span{display:none}.actions{gap:5px}.btn{font-size:11px;padding:8px 9px}.btn.light{display:none}}
</style>
</head>
<body>
<div class="shell">
<header class="nav">
<div class="brand"><strong>2027 Colorado Convention Planning Map</strong><span>Congregations, international delegate hotels and RTD rail planning</span></div>
<nav class="actions" aria-label="Planning map navigation">
<a class="btn light" href="full-map.html" target="_blank" rel="noopener">Open Map Full Screen</a>
<a class="btn primary" href="bus-access/">Bus Access Review Map →</a>
</nav>
</header>
<main class="frame-wrap"><iframe class="frame" src="full-map.html" title="Full 2027 Colorado Convention planning map"></iframe></main>
</div>
</body>
</html>
