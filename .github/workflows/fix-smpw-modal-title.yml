name: Fix SMPW modal title

on:
  push:
    paths:
      - '.github/workflows/fix-smpw-modal-title.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply SMPW modal-title fix
        run: python .github/scripts/fix_smpw_modal_title.py
      - name: Validate SMPW planner
        run: |
          node --check smpw/app.js
          node --check smpw/data.js
          grep -q 'els.locationModalTitle' smpw/app.js
          ! grep -q 'els.smpwLocationModalTitle' smpw/app.js
          grep -q 'smpw-20260926-2' smpw/index.html
          grep -q 'smpw-20260926-2' index.html
      - name: Commit SMPW fix
        run: |
          git config user.name 'LETDesignWorks'
          git config user.email 'michael@letdw.com'
          git add smpw/app.js smpw/index.html index.html
          git commit -m 'Fix SMPW add-location modal and refresh version'
          git push
