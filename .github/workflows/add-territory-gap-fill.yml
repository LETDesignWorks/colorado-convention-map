name: Add territory address gap tools

on:
  push:
    paths:
      - '.github/workflows/add-territory-gap-fill.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply territory address gap tools
        run: python .github/scripts/add_territory_gap_fill.py

      - name: Validate territory gap tools
        run: |
          node --check territories/app-main.js
          grep -q 'function fillAddressGaps' territories/app-main.js
          grep -q 'function addMissingAddress' territories/app-main.js
          grep -q 'Colorado Public Parcel Situs Addresses' territories/app-main.js
          grep -q 'manualGap: Boolean' territories/app-main.js
          grep -q 'Fill missing address gaps' territories/template.html
          grep -q 'gap-fill-panel' territories/styles.css
          grep -q 'territories-20260925-6' territories/bootstrap.js

      - name: Commit territory gap tools
        run: |
          git config user.name 'LETDesignWorks'
          git config user.email 'michael@letdw.com'
          git add territories/app-main.js territories/template.html territories/styles.css territories/bootstrap.js territories/index.html
          git commit -m 'Add supplemental sources and missing-address entry to territories'
          git push
