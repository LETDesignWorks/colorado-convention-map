name: Add territory address gap tools

on:
  push:
    paths:
      - '.github/workflows/add-territory-gap-fill.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add supplemental official sources and typed missing-address entry
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected one match, found {count}')
              return text.replace(old, new, 1)

          app_path = Path('territories/app-main.js')
          app = app_path.read_text(encoding='utf-8')

          app = replace_once(
              app,
              "const AVOID_GEOCODE_TIMEOUT_MS = 12000;\n",
              """const AVOID_GEOCODE_TIMEOUT_MS = 12000;
const COLORADO_PARCEL_SOURCE = {
  key: 'colorado-parcels',
  label: 'Colorado Public Parcel Situs Addresses',
  endpoint: 'https://gis.colorado.gov/public/rest/services/Address_and_Parcel/Colorado_Public_Parcels/FeatureServer/0/query',
  infoUrl: 'https://gis.colorado.gov/public/rest/services/Address_and_Parcel/Colorado_Public_Parcels/FeatureServer/0',
  outFields: ['OBJECTID','parcel_id','countyName','situsAdd','sitAddCty','sitAddZip','landUseCde','landUseDsc','dateReceived'],
  returnGeometry: true,
  returnCentroid: false
};
""",
              'supplemental parcel constant'
          )

          app = replace_once(
              app,
              "'importFile','clearHousesButton','avoidAddressInput','avoidAddressMessage','addAvoidAddressButton','addressProgress','addressMessage','territoryCountChip','targetSize','customTargetWrap',",
              "'importFile','clearHousesButton','gapFillButton','gapFillMessage','missingAddressInput','missingAddressMessage','addMissingAddressButton','avoidAddressInput','avoidAddressMessage','addAvoidAddressButton','addressProgress','addressMessage','territoryCountChip','targetSize','customTargetWrap',",
              'gap tool element ids'
          )

          gap_helpers = r'''function parcelSupplementPoint(feature) {
            const attributes = feature?.attributes || feature?.properties || {};
            const situs = clean(attributes.situsAdd || attributes.SITUSADD || attributes.situs_address || '');
            if (!situs || !/^\s*\d/.test(situs)) return null;
            const city = clean(attributes.sitAddCty || attributes.SITADDCTY || '');
            const zip = clean(attributes.sitAddZip || attributes.SITADDZIP || '').slice(0, 10);
            const address = [situs, city, 'CO', zip].filter(Boolean).join(' ').replace(/\s+/g, ' ').trim();
            const geometry = feature?.geometry || {};
            let lat = Number(geometry.y);
            let lng = Number(geometry.x);
            if ((!Number.isFinite(lat) || !Number.isFinite(lng)) && Array.isArray(geometry.rings) && geometry.rings.length) {
              try {
                const firstRing = geometry.rings.find(ring => Array.isArray(ring) && ring.length >= 4);
                if (firstRing) {
                  const point = turf.pointOnFeature(turf.polygon([firstRing]));
                  [lng, lat] = point.geometry.coordinates;
                }
              } catch {
                const coordinates = geometry.rings.flat().filter(point => Array.isArray(point) && Number.isFinite(Number(point[0])) && Number.isFinite(Number(point[1])));
                if (coordinates.length) {
                  lng = coordinates.reduce((sum, point) => sum + Number(point[0]), 0) / coordinates.length;
                  lat = coordinates.reduce((sum, point) => sum + Number(point[1]), 0) / coordinates.length;
                }
              }
            }
            if (!Number.isFinite(lat) || !Number.isFinite(lng)) return null;
            const landUse = clean(attributes.landUseDsc || attributes.LANDUSEDSC || attributes.landUseCde || '');
            const clearlyNonResidential = /\b(?:COMMERCIAL|INDUSTRIAL|RETAIL|OFFICE|WAREHOUSE|UTILITY|SCHOOL|CHURCH|GOVERNMENT|PARK|OPEN SPACE|COMMON AREA|VACANT|AGRICULTURAL|FARM|EXEMPT)\b/i.test(landUse);
            return {
              id: `parcel-${attributes.OBJECTID ?? attributes.parcel_id ?? uniqueId('parcel')}`,
              address,
              baseAddress: address,
              unit: '',
              lat: Number(lat),
              lng: Number(lng),
              source: 'Colorado Public Parcel Situs Address',
              residential: !clearlyNonResidential,
              classification: landUse || 'Parcel situs address — verify locally',
              unitCount: 1,
              rawId: attributes.parcel_id ?? attributes.OBJECTID ?? null,
              supplemental: true,
              included: true,
              territoryId: null
            };
          }
          function addressRecordsMatch(a, b) {
            const includeUnits = Boolean(els.separateUnits?.checked);
            const keyA = normalizeAddressKey(includeUnits ? a.address : (a.baseAddress || a.address), includeUnits);
            const keyB = normalizeAddressKey(includeUnits ? b.address : (b.baseAddress || b.address), includeUnits);
            if (keyA && keyB && keyA === keyB) return true;
            const parsedA = splitStreetSort(a.address || a.baseAddress || '');
            const parsedB = splitStreetSort(b.address || b.baseAddress || '');
            if (parsedA?.number && parsedB?.number && parsedA.number === parsedB.number && parsedA.street && parsedA.street === parsedB.street) {
              return distanceMiles(a, b) <= 0.12;
            }
            return false;
          }
          function mergeSupplementalAddressRecords(records) {
            const candidates = dedupeAddressRecords(records);
            let added = 0;
            let duplicate = 0;
            for (const candidate of candidates) {
              if (houses.some(existing => addressRecordsMatch(existing, candidate))) {
                duplicate += 1;
                continue;
              }
              houses.push({
                ...candidate,
                id: String(candidate.id || uniqueId('supplement')),
                supplemental: true,
                avoid: false,
                included: true,
                territoryId: null
              });
              added += 1;
            }
            return { added, duplicate };
          }
          async function fillAddressGaps() {
            if (!requireAdmin()) return;
            if (!boundaryGeometry) { toast('Draw or load the congregation boundary before checking for missing addresses.', true); return; }
            const button = els.gapFillButton;
            button.disabled = true;
            button.textContent = 'Checking Sources…';
            els.addressProgress.hidden = false;
            els.gapFillMessage.dataset.state = 'working';
            const results = [];
            const errors = [];
            try {
              const current = currentSourceKey();
              const inferred = inferSourceForLocation(selectedHall);
              const pointSourceKeys = [];
              if (!houses.length && current && current !== 'manual') pointSourceKeys.push(current);
              if (current !== 'colorado') pointSourceKeys.push('colorado');
              else if (inferred && !['manual','colorado'].includes(inferred)) pointSourceKeys.push(inferred);
              for (const sourceKey of [...new Set(pointSourceKeys)]) {
                const source = ASSESSOR_SOURCES[sourceKey];
                if (!source) continue;
                els.gapFillMessage.textContent = `Checking ${source.label} for addresses not already loaded…`;
                try {
                  const result = await loadParsedSource(sourceKey);
                  const merged = mergeSupplementalAddressRecords(result.parsed);
                  results.push(`${merged.added.toLocaleString()} from ${source.label}`);
                } catch (error) {
                  errors.push(`${source.label}: ${friendlyError(error)}`);
                }
              }

              els.gapFillMessage.textContent = 'Checking Colorado parcel situs addresses for additional properties…';
              try {
                const parcelFeatures = await queryArcGisSource(COLORADO_PARCEL_SOURCE, true);
                const parcelRecords = parcelFeatures.map(parcelSupplementPoint).filter(Boolean);
                const merged = mergeSupplementalAddressRecords(parcelRecords);
                results.push(`${merged.added.toLocaleString()} from parcel situs addresses`);
              } catch (error) {
                errors.push(`${COLORADO_PARCEL_SOURCE.label}: ${friendlyError(error)}`);
              }

              const added = results.reduce((sum, item) => sum + (Number(item.match(/^([\d,]+)/)?.[1].replace(/,/g, '')) || 0), 0);
              if (added) currentPlanId = null;
              renderAllPlanningData();
              if (added) {
                els.gapFillMessage.textContent = `${added.toLocaleString()} additional address${added === 1 ? '' : 'es'} added as unassigned. ${results.join('; ')}.${errors.length ? ` Some sources could not be checked: ${errors.join(' | ')}` : ''}`;
                els.gapFillMessage.dataset.state = errors.length ? 'warning' : 'success';
                toast(`${added.toLocaleString()} additional address${added === 1 ? '' : 'es'} added without replacing existing territories.`);
              } else {
                els.gapFillMessage.textContent = `No additional unique addresses were found in the other official sources.${errors.length ? ` ${errors.join(' | ')}` : ' Enter a known missing address below to add it directly.'}`;
                els.gapFillMessage.dataset.state = errors.length ? 'warning' : 'waiting';
                toast('No additional unique addresses were found. Use the missing-address entry for a known address.', true);
              }
            } finally {
              els.addressProgress.hidden = true;
              button.disabled = !isAdmin();
              button.textContent = 'Search Other Official Address Sources';
            }
          }
          async function addMissingAddress() {
            if (!requireAdmin()) return;
            if (!boundaryGeometry) { toast('Draw or load the congregation boundary before adding a missing address.', true); return; }
            const address = clean(els.missingAddressInput.value);
            if (!address) { toast('Enter the complete missing address.', true); els.missingAddressInput.focus(); return; }
            const button = els.addMissingAddressButton;
            button.disabled = true;
            button.textContent = 'Locating…';
            els.missingAddressMessage.textContent = 'Locating the address and checking the current congregation boundary…';
            els.missingAddressMessage.dataset.state = 'working';
            try {
              const result = await geocodeAvoidAddress(address);
              const candidate = { lat: Number(result.lat), lng: Number(result.lng) };
              if (!Number.isFinite(candidate.lat) || !Number.isFinite(candidate.lng)) throw new Error('The address service returned invalid coordinates.');
              if (!pointInsideBoundary(candidate)) throw new Error('The matched address is outside the current congregation boundary. Verify the address or enlarge the boundary first.');
              const matchedAddress = clean(result.matchedAddress || address);
              let existing = houses.find(house => addressRecordsMatch(house, { ...candidate, address: matchedAddress, baseAddress: matchedAddress }));
              if (existing) {
                selectedHouseIds = new Set([existing.id]);
                renderAllPlanningData();
                map?.setView([existing.lat, existing.lng], Math.max(map.getZoom(), 17), { animate: true });
                houseMarkers.get(existing.id)?.openPopup();
                const status = existing.avoid ? 'already marked Avoid / Do Not Visit' : existing.included ? 'already loaded' : 'already loaded but excluded';
                els.missingAddressMessage.textContent = `${existing.address} is ${status}.`;
                els.missingAddressMessage.dataset.state = existing.avoid ? 'warning' : 'success';
                toast(`${existing.address} is already in this plan.`);
                return;
              }
              const record = {
                id: uniqueId('missing'),
                address: matchedAddress,
                baseAddress: matchedAddress,
                unit: '',
                lat: candidate.lat,
                lng: candidate.lng,
                source: `Manual missing address — ${result.source}`,
                residential: true,
                classification: 'Manually added missing address',
                unitCount: 1,
                manualGap: true,
                supplemental: true,
                avoid: false,
                included: true,
                territoryId: null
              };
              if (!addHouseRecord(record)) throw new Error('The address matches a point already loaded in this plan.');
              currentPlanId = null;
              selectedHouseIds = new Set([record.id]);
              renderAllPlanningData();
              map?.setView([record.lat, record.lng], Math.max(map.getZoom(), 17), { animate: true });
              houseMarkers.get(record.id)?.openPopup();
              els.missingAddressInput.value = '';
              els.missingAddressMessage.textContent = `${record.address} was added as an unassigned address. Save the territory plan to retain it.`;
              els.missingAddressMessage.dataset.state = 'success';
              toast(`Missing address added: ${record.address}`);
            } catch (error) {
              els.missingAddressMessage.textContent = `Could not add the missing address: ${friendlyError(error)}`;
              els.missingAddressMessage.dataset.state = 'error';
              toast(`Could not add the missing address: ${friendlyError(error)}`, true);
            } finally {
              button.disabled = !isAdmin();
              button.textContent = 'Locate & Add Missing Address';
            }
          }
          
          '''
          app = replace_once(
              app,
              'async function loadAddresses() {',
              gap_helpers + 'async function loadAddresses() {',
              'gap helper insertion'
          )

          app = replace_once(
              app,
              "  const retainedAvoids = houses.filter(house => house.avoid).map(house => ({ ...house }));\n  try {",
              "  const retainedAvoids = houses.filter(house => house.avoid).map(house => ({ ...house }));\n  const retainedManualGaps = houses.filter(house => house.manualGap && !house.avoid).map(house => ({ ...house, territoryId: null }));\n  try {",
              'retain manual missing addresses'
          )
          app = replace_once(
              app,
              "  const refreshedAddresses = dedupeAddressRecords(result.parsed);\n  houses = mergeAvoidAddresses(refreshedAddresses, retainedAvoids).map(item => ({ ...item, id: String(item.id || uniqueId('address')) }));",
              """  const refreshedAddresses = dedupeAddressRecords(result.parsed);
  houses = mergeAvoidAddresses(refreshedAddresses, retainedAvoids).map(item => ({ ...item, id: String(item.id || uniqueId('address')) }));
  for (const manual of retainedManualGaps) {
    if (!houses.some(existing => addressRecordsMatch(existing, manual))) {
      houses.push({ ...manual, id: String(manual.id || uniqueId('missing')), manualGap: true, supplemental: true, avoid: false, included: true, territoryId: null });
    }
  }""",
              'restore manual missing addresses after reload'
          )

          app = replace_once(
              app,
              "    avoid: Boolean(house.avoid), avoidSource: house.avoidSource || '', territoryId: house.avoid ? null : house.territoryId || null,\n    rawId: house.rawId ?? null",
              "    avoid: Boolean(house.avoid), avoidSource: house.avoidSource || '', territoryId: house.avoid ? null : house.territoryId || null,\n    manualGap: Boolean(house.manualGap), supplemental: Boolean(house.supplemental), rawId: house.rawId ?? null",
              'save manual and supplemental flags'
          )

          app = replace_once(
              app,
              "    recordType: house.avoid ? 'avoid-address' : 'ministry-address', address: house.address, source: house.source, included: house.included, avoid: Boolean(house.avoid),\n    territoryId: house.avoid ? '' : house.territoryId || '', territoryName: house.avoid ? '' : territoryById.get(house.territoryId) || ''",
              "    recordType: house.avoid ? 'avoid-address' : 'ministry-address', address: house.address, source: house.source, included: house.included, avoid: Boolean(house.avoid), manualGap: Boolean(house.manualGap), supplemental: Boolean(house.supplemental),\n    territoryId: house.avoid ? '' : house.territoryId || '', territoryName: house.avoid ? '' : territoryById.get(house.territoryId) || ''",
              'GeoJSON gap flags'
          )
          app = replace_once(
              app,
              "  const rows = [['territory','address','latitude','longitude','included','avoid','source','classification','unit_count']];",
              "  const rows = [['territory','address','latitude','longitude','included','avoid','manual_added','supplemental','source','classification','unit_count']];",
              'CSV gap headers'
          )
          app = replace_once(
              app,
              "    house.included && !house.avoid ? 'Yes' : 'No', house.avoid ? 'Yes' : 'No', house.source || '', house.classification || '', house.unitCount || 1",
              "    house.included && !house.avoid ? 'Yes' : 'No', house.avoid ? 'Yes' : 'No', house.manualGap ? 'Yes' : 'No', house.supplemental ? 'Yes' : 'No', house.source || '', house.classification || '', house.unitCount || 1",
              'CSV gap values'
          )

          app = replace_once(
              app,
              "  els.addHouseButton.addEventListener('click', toggleManualHouseMode);\n  els.addAvoidAddressButton.addEventListener('click', addAvoidAddress);",
              "  els.addHouseButton.addEventListener('click', toggleManualHouseMode);\n  els.gapFillButton.addEventListener('click', fillAddressGaps);\n  els.addMissingAddressButton.addEventListener('click', addMissingAddress);\n  els.missingAddressInput.addEventListener('keydown', event => { if (event.key === 'Enter') { event.preventDefault(); addMissingAddress(); } });\n  els.addAvoidAddressButton.addEventListener('click', addAvoidAddress);",
              'gap event handlers'
          )

          app = replace_once(
              app,
              "  if (els.avoidAddressInput) els.avoidAddressInput.value = '';\n  if (els.avoidAddressMessage)",
              "  if (els.missingAddressInput) els.missingAddressInput.value = '';\n  if (els.missingAddressMessage) { els.missingAddressMessage.textContent = 'Enter a known missing address to add it as an unassigned home.'; els.missingAddressMessage.dataset.state = 'waiting'; }\n  if (els.gapFillMessage) { els.gapFillMessage.textContent = 'Search the other official address and parcel sources after the first address load.'; els.gapFillMessage.dataset.state = 'waiting'; }\n  if (els.avoidAddressInput) els.avoidAddressInput.value = '';\n  if (els.avoidAddressMessage)",
              'reset gap controls'
          )

          app_path.write_text(app, encoding='utf-8')

          template_path = Path('territories/template.html')
          template = template_path.read_text(encoding='utf-8')
          gap_panel = '''        <div class="gap-fill-panel">
          <div class="gap-fill-heading"><strong>Fill missing address gaps</strong><span>Does not replace existing territory work</span></div>
          <p>Search the alternate official county/state address points and the Colorado public parcel situs-address layer. New unique addresses are added as unassigned homes.</p>
          <button class="btn outline full admin-control" id="gapFillButton" type="button">Search Other Official Address Sources</button>
          <small id="gapFillMessage" data-state="waiting">Search the other official address and parcel sources after the first address load.</small>
          <div class="field gap-manual-field">
            <label for="missingAddressInput">Add a known missing address</label>
            <div class="gap-address-entry">
              <input id="missingAddressInput" type="text" autocomplete="street-address" placeholder="Example: 9345 Princeton Cir, Highlands Ranch, CO 80130"/>
              <button class="btn save admin-control" id="addMissingAddressButton" type="button">Locate &amp; Add Missing Address</button>
            </div>
            <small id="missingAddressMessage" data-state="waiting">Enter a known missing address to add it as an unassigned home.</small>
          </div>
          <small class="gap-caution">Parcel points and geocoded addresses are planning aids. Confirm the house, entrance, unit count, and residential use locally before assigning it.</small>
        </div>
'''
          template = replace_once(
              template,
              '        <div class="avoid-address-panel">',
              gap_panel + '        <div class="avoid-address-panel">',
              'gap panel insertion'
          )
          template = replace_once(
              template,
              '<small id="sourceDetail"></small><small>Large boundaries are now queried in smaller sections. If a county service is unavailable, the planner will automatically try the statewide Colorado address source.</small>',
              '<small id="sourceDetail"></small><small>Large boundaries are queried in smaller sections. If the first source is incomplete, use Fill Missing Address Gaps to merge the other official address source and statewide parcel situs addresses without replacing existing work.</small>',
              'source guidance update'
          )
          template_path.write_text(template, encoding='utf-8')

          styles_path = Path('territories/styles.css')
          styles = styles_path.read_text(encoding='utf-8')
          styles += r'''

/* Supplemental address-gap tools */
.gap-fill-panel{margin:12px 0 10px;padding:11px;border:1px solid #a9c9df;border-left:4px solid #0b5b9f;border-radius:12px;background:#f4faff}
.gap-fill-heading{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:5px}.gap-fill-heading strong{color:#174f7d;font-size:12px}.gap-fill-heading span{border-radius:999px;padding:3px 6px;background:#deeffa;color:#255f88;font-size:8px;font-weight:850;white-space:nowrap}
.gap-fill-panel p{font-size:10px;line-height:1.42;color:#587087;margin:0 0 9px}.gap-fill-panel>small{display:block;margin-top:6px;font-size:9.5px;line-height:1.4;color:#62768b}.gap-manual-field{margin:11px 0 0;padding-top:10px;border-top:1px solid #d5e5f0}.gap-address-entry{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:7px;align-items:center}.gap-address-entry input{min-width:0}.gap-caution{color:#746646!important}
#gapFillMessage[data-state="working"],#missingAddressMessage[data-state="working"]{color:#745500;font-weight:750}
#gapFillMessage[data-state="success"],#missingAddressMessage[data-state="success"]{color:#176842;font-weight:750}
#gapFillMessage[data-state="warning"],#missingAddressMessage[data-state="warning"]{color:#825b00;font-weight:750}
#gapFillMessage[data-state="error"],#missingAddressMessage[data-state="error"]{color:#922f28;font-weight:750}
@media(max-width:600px){.gap-fill-heading{display:block}.gap-fill-heading span{display:inline-flex;margin-top:5px}.gap-address-entry{grid-template-columns:1fr}.gap-address-entry .btn{width:100%}}
'''
          styles_path.write_text(styles, encoding='utf-8')

          new_version = 'territories-20260925-6'
          for path in [Path('territories/bootstrap.js'), Path('territories/index.html')]:
              text = path.read_text(encoding='utf-8')
              text = re.sub(r'territories-\d{8}-\d+', new_version, text)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Validate territory gap tools
        run: |
          node --check territories/app-main.js
          grep -q 'function fillAddressGaps' territories/app-main.js
          grep -q 'function addMissingAddress' territories/app-main.js
          grep -q 'Colorado Public Parcel Situs Addresses' territories/app-main.js
          grep -q 'manualGap: Boolean' territories/app-main.js
          grep -q 'Fill missing address gaps' territories/template.html
          grep -q 'gap-fill-panel' territories/styles.css
          grep -q 'territories-20260925-6' territories/bootstrap.js

      - name: Commit territory gap tools
        run: |
          git config user.name 'LETDesignWorks'
          git config user.email 'michael@letdw.com'
          git add territories/app-main.js territories/template.html territories/styles.css territories/bootstrap.js territories/index.html
          git commit -m 'Add supplemental sources and missing-address entry to territories'
          git push
