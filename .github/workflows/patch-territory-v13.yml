name: Patch territory assessor scan and duplex PDF v13

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-territory-v13.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install direct scanner and duplex PDF layout
        shell: bash
        run: |
          python - <<'PYCODE'
          from pathlib import Path
          import base64, gzip
          scanner = gzip.decompress(base64.b64decode(""))
          Path('territories/assessor-scan-direct.js').write_bytes(scanner)
          replacement = base64.b64decode("").decode('utf-8')
          pdf_path = Path('territories/territory-flex-grouping-pdf.js')
          pdf = pdf_path.read_text(encoding='utf-8')
          pdf = pdf.replace("const FLEX_VERSION = 'territories-20261010-7';", "const FLEX_VERSION = 'territories-20261010-13';", 1)
          start_marker = "    const doc = new jsPDF({ orientation: 'landscape', unit: 'in', format: 'letter', compress: true });"
          end_marker = "    addAvoidPages(doc, logo, territory, allAvoids, new Set(mapAvoids.map(house => String(house.id))), hall, congregation);"
          start = pdf.find(start_marker)
          end = pdf.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('Could not locate the territory PDF first-page block.')
          pdf = pdf[:start] + replacement + pdf[end:]
          pdf = pdf.replace("toast(`${territory.name} PDF created with the Denver 2027 logo, street-map background, numbered homes, and Avoid / Do Not Visit appendix.`);", "toast(`${territory.name} PDF created with the territory map on the front, the complete address list beginning on the back, and the Avoid / Do Not Visit appendix.`);", 1)
          pdf_path.write_text(pdf, encoding='utf-8')
          bootstrap_path = Path('territories/bootstrap.js')
          bootstrap = bootstrap_path.read_text(encoding='utf-8')
          bootstrap = bootstrap.replace('territories-20261010-12', 'territories-20261010-13')
          bootstrap = bootstrap.replace("await import('./assessor-scan-responsive.js?v=territories-20261010-13');", "await import('./assessor-scan-direct.js?v=territories-20261010-13');")
          bootstrap_path.write_text(bootstrap, encoding='utf-8')
          index_path = Path('territories/index.html')
          index = index_path.read_text(encoding='utf-8').replace('territories-20261010-12', 'territories-20261010-13')
          index_path.write_text(index, encoding='utf-8')
          Path('.github/workflows/patch-territory-v13.yml').unlink()
          PYCODE

      - name: Validate JavaScript
        shell: bash
        run: |
          node --check territories/assessor-scan-direct.js
          node --check territories/territory-flex-grouping-pdf.js
          node --check territories/bootstrap.js

      - name: Commit repair
        shell: bash
        run: |
          git config user.name 'LETDesignWorks'
          git config user.email 'michael@letdw.com'
          git add -A
          git commit -m 'Repair assessor scan and duplex territory PDFs'
          git push origin main
