name: Add explicit territory edit buttons

on:
  push:
    paths:
      - '.github/workflows/add-explicit-territory-edit-buttons.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add visible save and cancel controls for territory editing
        run: |
          python -c "from pathlib import Path; p=Path('.github/scripts/add_explicit_territory_edit_buttons.py'); s=p.read_text(encoding='utf-8'); p.write_text(s.replace('The live address count will update as you move the handles; save with the map toolbar checkmark.', 'Move the handles, then select the map checkmark. The boundary and home assignments will update together.'), encoding='utf-8')"
          python .github/scripts/add_explicit_territory_edit_buttons.py

      - name: Validate explicit edit controls
        run: |
          node --check territories/app-main.js
          node --check territories/bootstrap.js
          grep -q 'id="territoryEditActions"' territories/template.html
          grep -q 'id="saveTerritoryBoundaryEditButton"' territories/template.html
          grep -q 'function saveActiveTerritoryBoundaryEdit' territories/app-main.js
          grep -q 'Save Boundary & Update Homes at the bottom of the map' territories/app-main.js
          grep -q '.territory-edit-actions{' territories/styles.css
          grep -q 'territories-20260927-6' territories/bootstrap.js
          grep -q 'territories-20260927-6' territories/index.html

      - name: Commit territory edit controls
        run: |
          git config user.name 'LETDesignWorks'
          git config user.email 'michael@letdw.com'
          git add territories/app-main.js territories/template.html territories/styles.css territories/bootstrap.js territories/index.html
          git commit -m 'Add visible save controls for territory boundary edits' || exit 0
          git push
