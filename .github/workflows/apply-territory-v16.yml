name: Apply Denver 2027 Territory Planner v16

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-territory-v16.yml'

permissions:
  contents: write

concurrency:
  group: territory-planner-v16
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the website
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply territory planner improvements
        shell: bash
        run: |
          cat > /tmp/patch_v16.py <<'PY_PATCH'
          from pathlib import Path
          import base64
          import re
          
          VERSION = 'territories-20261011-16'
          
          def read(path):
              return Path(path).read_text(encoding="utf-8")
          
          def write(path, text):
              Path(path).write_text(text, encoding="utf-8")
          
          def sub_once(text, pattern, replacement, label, flags=0):
              updated, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return updated
          
          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)
          
          # Exact official Denver 2027 logo supplied by the user.
          Path("assets/denver-2027-territory-logo.png").write_bytes(
              base64.b64decode('')
          )
          
          # 1) Screen colors, source legend, and scanner labels.
          path = "territories/address-source-merge.js"
          text = read(path)
          text = re.sub(r"const SOURCE_VERSION = '[^']+';", f"const SOURCE_VERSION = '{VERSION}';", text, count=1)
          text = re.sub(
              r"const OFFICIAL_COLOR = '#[0-9A-Fa-f]{6}';(?:\nconst OFFICIAL_BORDER = '#[0-9A-Fa-f]{6}';)?",
              "const OFFICIAL_COLOR = '#16A6A1';\nconst OFFICIAL_BORDER = '#0B6F6B';",
              text,
              count=1
          )
          text = text.replace("color: uploaded ? UPLOADED_BORDER : '#ffffff',", "color: uploaded ? UPLOADED_BORDER : OFFICIAL_BORDER,")
          text = text.replace("marker.setRadius?.(uploaded ? 5.4 : 4.1);", "marker.setRadius?.(uploaded ? 5.4 : 5.0);")
          text = text.replace("Assessor/GIS or manually added address", "Assessor/GIS address — teal until assigned")
          text = text.replace(".official-source-symbol{background:${OFFICIAL_COLOR}!important;border-color:#fff!important;",
                              ".official-source-symbol{background:${OFFICIAL_COLOR}!important;border-color:${OFFICIAL_BORDER}!important;")
          text = text.replace("Official assessor/GIS or manually added homes stay gray.", "Official assessor/GIS homes stay teal.")
          text = text.replace("<small>Gray until assigned</small>", "<small>Teal until assigned</small>")
          text = text.replace("assessor/GIS or manually added addresses in gray", "assessor/GIS addresses in teal")
          text = re.sub(r"Assessor/GIS scanner v\d+ ready", "Assessor/GIS scanner v16 ready", text)
          text = re.sub(r"territories-\d{8}-\d+", VERSION, text)
          write(path, text)
          
          # 2) Lower-left web legend and teal default address symbol.
          path = "territories/styles.css"
          text = read(path)
          override = """
          /* __VERSION__ — map legend placement and assessor color */
          .map-legend{top:auto!important;right:auto!important;left:12px!important;bottom:58px!important}
          .map-note{left:auto!important;right:12px!important;bottom:12px!important}
          .house-symbol{background:#16A6A1!important;box-shadow:0 0 0 1px #0B6F6B!important}
          @media(max-width:880px){
            .map-legend{top:auto!important;right:auto!important;left:8px!important;bottom:56px!important}
            .map-note{left:auto!important;right:8px!important;bottom:8px!important}
          }
          """.replace("__VERSION__", VERSION)
          if VERSION not in text:
              text += override
          write(path, text)
          
          # 3) Duplicate prevention, avoid-territory association, and source colors.
          path = "territories/app-main.js"
          text = read(path)
          helpers = base64.b64decode('').decode()
          text = sub_once(
              text,
              r"function addHouseRecord\(record\) \{.*?\n\}\nfunction findExistingHouseForAvoid",
              helpers + "\nfunction findExistingHouseForAvoid",
              "replace addHouseRecord with dedupe-aware implementation",
              re.S
          )
          match_block = base64.b64decode('').decode()
          text = sub_once(
              text,
              r"function addressRecordsMatch\(a, b\) \{.*?\n\}\nfunction mergeSupplementalAddressRecords",
              match_block + "\nfunction mergeSupplementalAddressRecords",
              "replace addressRecordsMatch",
              re.S
          )
          text = sub_once(
              text,
              r"function markHouseAvoid\(house\) \{.*?\n\}\nfunction markSelectedAvoid",
              """function markHouseAvoid(house) {
            if (house.territoryId && !house.avoidTerritoryId) house.avoidTerritoryId = house.territoryId;
            house.avoid = true;
            house.included = false;
            house.territoryId = null;
            house.classification = 'Avoid / do not visit';
          }
          function markSelectedAvoid""",
              "replace markHouseAvoid",
              re.S
          )
          text = text.replace(
              "They will be removed from territory assignments.",
              "Their normal territory count will exclude them, but the red avoid marker will stay associated with the territory for maps and PDFs."
          )
          text = replace_once(
              text,
              """  for (const house of selected) {
              house.avoid = false;
              house.included = true;
              house.territoryId = null;
              if (house.classification === 'Avoid / do not visit') house.classification = 'Manual address';
            }""",
              """  for (const house of selected) {
              house.avoid = false;
              house.included = true;
              const previousTerritory = house.avoidTerritoryId && territories.some(item => String(item.id) === String(house.avoidTerritoryId))
                ? house.avoidTerritoryId : null;
              house.territoryId = previousTerritory;
              house.avoidTerritoryId = null;
              if (house.classification === 'Avoid / do not visit') house.classification = 'Manual address';
            }
            recalculateTerritoryHouseIds();""",
              "restore avoid association"
          )
          text = replace_once(
              text,
              """  const territory = territories.find(item => item.id === house.territoryId);
            const color = territory ? TERRITORY_COLORS[territory.colorIndex % TERRITORY_COLORS.length] : '#6b7c8f';
            return { radius: territory ? 5 : 4, color: '#fff', weight: 1.4, fillColor: color, fillOpacity: .9 };""",
              """  const territory = territories.find(item => item.id === house.territoryId);
            const uploaded = mapHouseIsUploaded(house);
            const color = territory ? TERRITORY_COLORS[territory.colorIndex % TERRITORY_COLORS.length] : uploaded ? '#7952c7' : '#16A6A1';
            return {
              radius: territory ? 5 : uploaded ? 5.4 : 5,
              color: territory ? '#fff' : uploaded ? '#4d2e8f' : '#0B6F6B',
              weight: territory ? 1.4 : 2,
              fillColor: color,
              fillOpacity: .94
            };""",
              "teal assessor house style"
          )
          text = text.replace(
              "const territory = territoryById.get(house.territoryId);",
              "const territory = territoryById.get(house.avoid ? house.avoidTerritoryId : house.territoryId);"
          )
          text = text.replace(
              "const color = house.avoid ? '#c9362b' : territory ? TERRITORY_COLORS[territory.colorIndex % TERRITORY_COLORS.length] : house.included ? '#6b7c8f' : '#b44b43';",
              "const color = house.avoid ? '#c9362b' : territory ? TERRITORY_COLORS[territory.colorIndex % TERRITORY_COLORS.length] : house.included ? (mapHouseIsUploaded(house) ? '#7952c7' : '#16A6A1') : '#b44b43';"
          )
          text = text.replace(
              "const status = house.avoid ? 'Avoid' : house.included ? territory?.name || 'Unassigned' : 'Excluded';",
              "const status = house.avoid ? `Avoid${territory?.name ? ` — ${territory.name}` : ''}` : house.included ? territory?.name || 'Unassigned' : 'Excluded';"
          )
          text = replace_once(
              text,
              "const points = houses.filter(house => house.included && !house.avoid && house.territoryId === territory.id && validMapCoordinates(house)).map(pointFeature);",
              "const points = houses.filter(house => ((house.included && !house.avoid && house.territoryId === territory.id) || (house.avoid && house.avoidTerritoryId === territory.id)) && validMapCoordinates(house)).map(pointFeature);",
              "include assigned avoid points in territory outline"
          )
          text = replace_once(
              text,
              "selectedHouseIds = new Set(houses.filter(house => house.included && house.territoryId === territoryId).map(house => house.id));",
              "selectedHouseIds = new Set(houses.filter(house => (house.included && house.territoryId === territoryId) || (house.avoid && house.avoidTerritoryId === territoryId)).map(house => house.id));",
              "select territory avoid markers"
          )
          text = replace_once(
              text,
              "houses.forEach(house => { house.territoryId = house.included && !house.avoid ? assignment.get(house.id) || null : null; });",
              "houses.forEach(house => { if (house.avoid) { house.territoryId = null; house.avoidTerritoryId = null; } else house.territoryId = house.included ? assignment.get(house.id) || null : null; });",
              "clear avoid links during automatic regrouping"
          )
          text = replace_once(
              text,
              "for (const house of houses) house.territoryId = null;",
              "for (const house of houses) { house.territoryId = null; house.avoidTerritoryId = null; }",
              "clear all territory and avoid links"
          )
          text = replace_once(
              text,
              "houses.forEach(house => { if (house.territoryId === id) house.territoryId = null; });",
              "houses.forEach(house => { if (house.territoryId === id) house.territoryId = null; if (house.avoidTerritoryId === id) house.avoidTerritoryId = null; });",
              "delete territory avoid links"
          )
          text = replace_once(
              text,
              "avoid: Boolean(house.avoid), avoidSource: house.avoidSource || '', territoryId: house.avoid ? null : house.territoryId || null,",
              "avoid: Boolean(house.avoid), avoidSource: house.avoidSource || '', territoryId: house.avoid ? null : house.territoryId || null,\n    avoidTerritoryId: house.avoid ? house.avoidTerritoryId || null : null,",
              "serialize avoid territory"
          )
          text = sub_once(
              text,
              r"houses = loadedHouses\.map\(item => \{\n    const avoid = Boolean\(item\.avoid\);\n    return \{ \.\.\.item, id: String\(item\.id\), avoid, included: avoid \? false : item\.included !== false, territoryId: avoid \? null : item\.territoryId \|\| null \};\n  \}\);",
              """houses = loadedHouses.map(item => {
              const avoid = Boolean(item.avoid);
              const avoidTerritoryId = avoid ? (item.avoidTerritoryId || item.territoryId || null) : null;
              return { ...item, id: String(item.id), avoid, included: avoid ? false : item.included !== false, territoryId: avoid ? null : item.territoryId || null, avoidTerritoryId };
            });
            const duplicatesRemovedOnLoad = dedupeHouseRecords();""",
              "preserve avoid territory on load"
          )
          text = replace_once(
              text,
              "if (!houses.length) { toast('Load or add addresses before saving the territory plan.', true); return null; }",
              "if (!houses.length) { toast('Load or add addresses before saving the territory plan.', true); return null; }\n  const duplicatesRemovedBeforeSave = dedupeHouseRecords();\n  if (duplicatesRemovedBeforeSave) renderAllPlanningData();",
              "dedupe before save"
          )
          text = text.replace(
              "territoryId: house.avoid ? '' : house.territoryId || '', territoryName: house.avoid ? '' : territoryById.get(house.territoryId) || '',",
              "territoryId: house.avoid ? house.avoidTerritoryId || '' : house.territoryId || '', territoryName: territoryById.get(house.avoid ? house.avoidTerritoryId : house.territoryId) || '',"
          )
          text = text.replace(
              "territoryById.get(house.territoryId) || '', house.address,",
              "territoryById.get(house.avoid ? house.avoidTerritoryId : house.territoryId) || '', house.address,"
          )
          text = sub_once(
              text,
              r"function avoidHousesInsideGeometry\(geometry\) \{.*?\n\}\nfunction addressHouseNumber",
              """function avoidHousesInsideGeometry(geometry, territoryId = '') {
            if (!geometry) return [];
            const feature = geometry.type === 'Feature' ? geometry : turf.feature(geometry.geometry || geometry);
            return houses.filter(house => {
              if (!house.avoid) return false;
              if (territoryId && String(house.avoidTerritoryId || '') === String(territoryId)) return true;
              try { return turf.booleanPointInPolygon(pointFeature(house), feature); }
              catch { return false; }
            }).sort((a, b) => {
              const aa = splitStreetSort(a.address), bb = splitStreetSort(b.address);
              return aa.street.localeCompare(bb.street) || aa.number - bb.number || a.address.localeCompare(b.address);
            });
          }
          function addressHouseNumber""",
              "include associated avoids in fallback PDF",
              re.S
          )
          text = text.replace(
              "const avoidHouses = avoidHousesInsideGeometry(geometry);",
              "const avoidHouses = avoidHousesInsideGeometry(geometry, territory.id);"
          )
          text = replace_once(
              text,
              "  addHouseRecord,\n  pointInsideBoundary,",
              "  addHouseRecord,\n  dedupeHouses: dedupeHouseRecords,\n  pointInsideBoundary,",
              "expose dedupe API"
          )
          write(path, text)
          
          # 4) Bulk avoid uploads convert an existing point instead of creating a duplicate.
          path = "territories/avoid-address-upload.js"
          text = read(path)
          text = text.replace(
              "function aMark(h,name){const old=!!h.avoid;h.avoid=true;h.included=false;h.territoryId=null;h.classification='Avoid / do not visit';",
              "function aMark(h,name){const old=!!h.avoid;if(h.territoryId&&!h.avoidTerritoryId)h.avoidTerritoryId=h.territoryId;h.avoid=true;h.included=false;h.territoryId=null;h.classification='Avoid / do not visit';"
          )
          text = text.replace(
              "avoid:true,included:false,territoryId:null,supplemental:true",
              "avoid:true,included:false,territoryId:null,avoidTerritoryId:null,supplemental:true"
          )
          write(path, text)
          
          # 5) Direct assessor scanner uses the central dedupe-aware add function.
          path = "territories/assessor-scan-direct.js"
          text = read(path)
          text = re.sub(r"const SCAN_VERSION = '[^']+';", f"const SCAN_VERSION = '{VERSION}';", text, count=1)
          text = replace_once(
              text,
              """      houses.push(newRecord);
                addressIndex.add(key);
                added += 1;""",
              """      if (planner.addHouseRecord?.(newRecord)) {
                  addressIndex.add(key);
                  added += 1;
                } else {
                  duplicates += 1;
                }""",
              "scanner central dedupe"
          )
          text = replace_once(
              text,
              "    const nextOffset = cursor.offset + features.length;",
              "    const collapsedDuplicates = Number(planner.dedupeHouses?.() || 0);\n    duplicates += collapsedDuplicates;\n    const nextOffset = cursor.offset + features.length;",
              "scanner final dedupe"
          )
          text = re.sub(r"territories-\d{8}-\d+", VERSION, text)
          write(path, text)
          
          # 6) PDF: exact logo, smaller main-map numbers, automatic zoomed detail pages, and associated avoid markers.
          path = "territories/territory-flex-grouping-pdf.js"
          text = read(path)
          text = re.sub(r"const FLEX_VERSION = '[^']+';", f"const FLEX_VERSION = '{VERSION}';", text, count=1)
          text = text.replace(
              "const ROUND_LOGO_URL = new URL('../assets/denver-2027-logo.png', import.meta.url).href;",
              "const ROUND_LOGO_URL = LOGO_URL;"
          )
          text = replace_once(
              text,
              "function relevantAvoids(allAvoids, houses, geometry) {\n  return allAvoids.filter(avoid => pointInsideGeometry(avoid, geometry) || houses.some(house => milesBetween(avoid, house) <= 0.25));\n}",
              "function relevantAvoids(allAvoids, houses, geometry, territoryId = '') {\n  return allAvoids.filter(avoid => String(avoid.avoidTerritoryId || '') === String(territoryId || '') || pointInsideGeometry(avoid, geometry) || houses.some(house => milesBetween(avoid, house) <= 0.25));\n}",
              "PDF relevant avoids"
          )
          text = text.replace(
              "async function buildStreetMapImage(territory, houses, avoids, geometry, status) {\n  const width = 1200, height = 760;",
              "async function buildStreetMapImage(territory, houses, avoids, geometry, status, options = {}) {\n  const width = Number(options.width) || 1200, height = Number(options.height) || 760;"
          )
          text = text.replace(
              "const viewport = chooseViewport(coordinates, width, height);",
              "const viewport = chooseViewport(coordinates, width, height, Number(options.padding) || 70);"
          )
          marker_block = base64.b64decode('').decode()
          text = sub_once(
              text,
              r"  houses\.forEach\(\(house, index\) => \{.*?\n  \}\);\n  avoids\.forEach",
              marker_block + "  avoids.forEach",
              "replace PDF marker drawing",
              re.S
          )
          text = text.replace(
              "context.beginPath(); context.arc(x, y, 12, 0, Math.PI * 2);",
              "context.beginPath(); context.arc(x, y, detailMode ? 13 : 9, 0, Math.PI * 2);"
          )
          text = text.replace(
              "context.beginPath(); context.moveTo(x - 5, y - 5); context.lineTo(x + 5, y + 5); context.moveTo(x - 5, y + 5); context.lineTo(x + 5, y - 5); context.stroke();",
              "const cross = detailMode ? 5 : 3.7; context.beginPath(); context.moveTo(x - cross, y - cross); context.lineTo(x + cross, y + cross); context.moveTo(x - cross, y + cross); context.lineTo(x + cross, y - cross); context.stroke();"
          )
          dense_helpers = base64.b64decode('').decode()
          text = replace_once(
              text,
              "  return { dataUrl: canvas.toDataURL('image/jpeg', 0.93), streetTilesLoaded: loaded };\n}\nasync function imageCanvasData",
              "  return { dataUrl: canvas.toDataURL('image/jpeg', 0.93), streetTilesLoaded: loaded };\n}\n" + dense_helpers + "\nasync function imageCanvasData",
              "insert dense PDF detail helpers"
          )
          text = replace_once(
              text,
              "function relevantAvoids(allAvoids, houses, geometry, territoryId = '') {\n  return allAvoids.filter(avoid => String(avoid.avoidTerritoryId || '') === String(territoryId || '') || pointInsideGeometry(avoid, geometry) || houses.some(house => milesBetween(avoid, house) <= 0.25));\n}",
              "function relevantAvoids(allAvoids, houses, geometry, territoryId = '') {\n  return allAvoids.filter(avoid => (territoryId && String(avoid.avoidTerritoryId || '') === String(territoryId)) || pointInsideGeometry(avoid, geometry) || houses.some(house => milesBetween(avoid, house) <= 0.25));\n}",
              "avoid empty territory match guard"
          )
          text = text.replace(
              "const houses = sortedByAddress(assigned.filter(validCoordinates));",
              "const houses = sortedByAddress(assigned.filter(validCoordinates)).map((house, index) => ({ ...house, _pdfNumber: index + 1 }));"
          )
          text = replace_once(
              text,
              """  const geometry = territoryGeometry(territory, houses);
            if (!geometry) return toast('A usable territory outline could not be created from the mapped homes.', true);
            const allAvoids = planner.getHouses().filter(house => house.avoid && validCoordinates(house));
            const mapAvoids = relevantAvoids(allAvoids, houses, geometry);""",
              """  const allAvoids = planner.getHouses().filter(house => house.avoid && validCoordinates(house));
            const assignedAvoids = allAvoids.filter(house => String(house.avoidTerritoryId || '') === String(territory.id));
            const geometry = territoryGeometry(territory, [...houses, ...assignedAvoids]);
            if (!geometry) return toast('A usable territory outline could not be created from the mapped homes.', true);
            const mapAvoids = relevantAvoids(allAvoids, houses, geometry, territory.id);""",
              "PDF assigned avoids and geometry"
          )
          text = text.replace(
              "const mapResult = await buildStreetMapImage(territory, houses, mapAvoids, geometry, status);",
              "const mapResult = await buildStreetMapImage(territory, houses, mapAvoids, geometry, status, { detail: false, width: 1200, height: 760, padding: 70 });"
          )
          text = text.replace(
              "doc.roundedRect(7.94, 7.38, 2.38, 0.30, 0.04, 0.04, 'FD');",
              "doc.roundedRect(0.62, 7.38, 2.78, 0.30, 0.04, 0.04, 'FD');"
          )
          text = text.replace(
              "doc.text(`${houses.length} homes • Red X = Avoid / Do Not Visit`, 8.06, 7.57);",
              "doc.text(`Number = address list • Red X = Avoid`, 0.74, 7.57);"
          )
          text = replace_once(
              text,
              """    addAddressListPages(doc, logo, territory, houses, 0, hall, congregation);
              addAvoidPages(doc, logo, territory, allAvoids, new Set(mapAvoids.map(house => String(house.id))), hall, congregation);""",
              """    addAddressListPages(doc, logo, territory, houses, 0, hall, congregation);
              const detailCount = await addDenseDetailPages(doc, logo, territory, houses, allAvoids, geometry, hall, congregation, status);
              addAvoidPages(doc, logo, territory, allAvoids, new Set(mapAvoids.map(house => String(house.id))), hall, congregation);""",
              "PDF detail pages call"
          )
          text = text.replace(
              "toast(`${territory.name} PDF created with the territory map on the front, the complete address list beginning on the back, and the Avoid / Do Not Visit appendix.`);",
              "toast(`${territory.name} PDF created with the full territory map on the front, the complete address list beginning on the back, ${detailCount ? `${detailCount} automatic zoomed map detail${detailCount === 1 ? '' : 's'}, ` : ''}and the Avoid / Do Not Visit appendix.`);"
          )
          text = replace_once(
              text,
              """        const near = relevantIds.has(String(avoid.id));
                  const label = `${index + 1}. ${avoid.address}${near ? '  —  NEAR THIS TERRITORY' : ''}`;""",
              """        const assigned = String(avoid.avoidTerritoryId || '') === String(territory.id);
                  const near = relevantIds.has(String(avoid.id));
                  const suffix = assigned ? '  —  THIS TERRITORY — AVOID' : near ? '  —  NEAR THIS TERRITORY' : '';
                  const label = `${index + 1}. ${avoid.address}${suffix}`;""",
              "avoid appendix assignment label"
          )
          text = text.replace(
              "doc.setFont('helvetica', near ? 'bold' : 'normal'); doc.setFontSize(8.1); doc.setTextColor(near ? 151 : 70, near ? 45 : 57, near ? 37 : 72);",
              "doc.setFont('helvetica', assigned || near ? 'bold' : 'normal'); doc.setFontSize(8.1); doc.setTextColor(assigned || near ? 151 : 70, assigned || near ? 45 : 57, assigned || near ? 37 : 72);"
          )
          text = re.sub(r"territories-\d{8}-\d+", VERSION, text)
          write(path, text)
          
          # 7) Cache-bust the whole Territory Planner.
          for path in ["territories/bootstrap.js", "territories/index.html"]:
              text = read(path)
              text = re.sub(r"territories-\d{8}-\d+", VERSION, text)
              write(path, text)
          
          # Remove temporary diagnostic workflows and this one-time workflow.
          for path in [
              ".github/workflows/inspect-territory-data.yml",
              ".github/workflows/apply-territory-v16.yml"
          ]:
              Path(path).unlink(missing_ok=True)
          PY_PATCH
          python /tmp/patch_v16.py

      - name: Validate JavaScript and official logo
        shell: bash
        run: |
          node --check territories/app-main.js
          node --check territories/address-source-merge.js
          node --check territories/assessor-scan-direct.js
          node --check territories/avoid-address-upload.js
          node --check territories/territory-flex-grouping-pdf.js
          node --check territories/bootstrap.js
          python - <<'PY'
          from pathlib import Path
          import struct
          path = Path('assets/denver-2027-territory-logo.png')
          data = path.read_bytes()
          if data[:8] != b'\x89PNG\r\n\x1a\n':
              raise SystemExit('The Denver 2027 logo is not a valid PNG.')
          width, height = struct.unpack('>II', data[16:24])
          if (width, height) != (997, 559):
              raise SystemExit(f'Unexpected Denver 2027 logo size: {width}x{height}')
          print(f'Official Denver 2027 logo verified: {width}x{height}')
          PY
          grep -q "territories-20261011-16" territories/bootstrap.js
          grep -q "#16A6A1" territories/address-source-merge.js
          grep -q "addDenseDetailPages" territories/territory-flex-grouping-pdf.js

      - name: Publish the update
        shell: bash
        run: |
          git config user.name 'LETDesignWorks'
          git config user.email 'michael@letdw.com'
          git add -A
          git commit -m 'Improve territory address colors, dedupe, avoid tracking, PDFs, and logo'
          git push origin main
