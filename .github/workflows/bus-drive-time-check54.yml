name: Verify Convention Center road-time correction
on:
  push:
    branches: [work/bus-drive-time-check-54]
permissions:
  contents: write
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Read the exact previously audited public routing snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import urllib.request,os,hashlib,zipfile,io,pathlib
          u='https://api.github.com/repos/LETDesignWorks/colorado-convention-map/actions/artifacts/12537591584/zip'
          req=urllib.request.Request(u,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(req,timeout=60) as response:data=response.read()
          assert hashlib.sha256(data).hexdigest()=='e9e100b110016a629450d2c804857c218645d3c3fa9a8fd1bdf1399d5b82661c'
          root=pathlib.Path('drive-time-audit');root.mkdir(exist_ok=True)
          with zipfile.ZipFile(io.BytesIO(data)) as z:
              for name in z.namelist():
                  if name.endswith('.json') and '/' not in name:(root/name).write_bytes(z.read(name))
          PY
          python .github/updates54/update.py
      - name: Install regression dependencies
        run: npm install --no-save --package-lock=false --ignore-scripts @turf/turf@7.2.0 jsdom@26.1.0 leaflet@1.9.4 leaflet-draw@1.0.4 jspdf@2.5.2
      - name: Test map integration, provenance and existing features
        run: |
          node --check bus-access/app-v2.js
          node --check bus-access/drive-time-area.mjs
          node --test tests/*.test.mjs > /tmp/drive-time-tests.log 2>&1 || { grep -A 35 '^not ok' /tmp/drive-time-tests.log; tail -12 /tmp/drive-time-tests.log; exit 1; }
          tail -12 /tmp/drive-time-tests.log
          git diff --exit-code -- territories routes route-planner bus-access/data.js bus-access/traffic-planner.mjs bus-access/traffic-model.mjs bus-access/traffic-pdf.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: road-time-correction-tests
          path: /tmp/drive-time-tests.log
          retention-days: 3
      - name: Commit verified files to review branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bus-access tests
          git commit -m 'Replace translated sketch with sourced 45-minute road-network outline'
          git push origin HEAD:refs/heads/work/bus-drive-time-check-54
