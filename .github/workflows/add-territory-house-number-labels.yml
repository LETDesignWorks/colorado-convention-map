name: Add house numbers to territory PDFs

on:
  push:
    paths:
      - '.github/workflows/add-territory-house-number-labels.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add address-number labels beside PDF home markers
        run: |
          echo '' | base64 --decode | python

      - name: Validate house-number label update
        run: |
          node --check territories/app-main.js
          grep -q 'function addressHouseNumber' territories/app-main.js
          grep -q 'const houseNumber = addressHouseNumber(house.address)' territories/app-main.js
          grep -q "street number beside its marker" territories/template.html
          grep -q 'territories-20260925-2' territories/bootstrap.js

      - name: Commit PDF house-number labels
        run: |
          git config user.name 'LETDesignWorks'
          git config user.email 'michael@letdw.com'
          git add territories/app-main.js territories/template.html territories/bootstrap.js territories/index.html
          git commit -m 'Add house numbers to printable territory maps' || exit 0
          git push
