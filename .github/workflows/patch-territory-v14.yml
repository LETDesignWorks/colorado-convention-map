name: Patch territory assessor fallback and PDF cache v14

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-territory-v14.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install assessor fallback and refresh PDF module
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64

          def replace_once(path, old, new, label):
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match in {path}, found {count}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          helper = base64.b64decode('').decode('utf-8')
          insertion = base64.b64decode('').decode('utf-8')

          path = 'territories/address-source-merge.js'
          replace_once(path, "const SOURCE_VERSION = 'territories-20261010-12';", "const SOURCE_VERSION = 'territories-20261010-14';", 'address source version')
          replace_once(path, "if (button && !scanBusy) { button.disabled = !planner?.isAdmin?.(); button.title = counts.uploaded ? 'Add official assessor/GIS addresses around the uploaded list.' : 'Upload or load an address file first; selecting the button will explain what is missing.'; }", "if (button && !scanBusy) { button.disabled = false; button.classList.remove('admin-control'); button.title = counts.uploaded ? 'Add official assessor/GIS addresses around the uploaded list.' : 'Select the button to see what is needed before the scan can begin.'; }", 'button enabled state')
          file = Path(path)
          text = file.read_text(encoding='utf-8')
          marker = 'async function initialize() {'
          if 'function ensureAssessorFallbackUi()' not in text:
              if marker not in text:
                  raise SystemExit('address-source initialize marker not found')
              text = text.replace(marker, helper + marker, 1)
          text = text.replace("if (document.getElementById('addressSourceMergeCard')) { placeAvoidAfterAssessor(); return true; }", "if (document.getElementById('addressSourceMergeCard')) { placeAvoidAfterAssessor(); ensureAssessorFallbackUi(); return true; }", 1)
          text = text.replace("if (assessorButton) assessorButton.dataset.responsiveScannerOnly = 'true';\n  return true;", "if (assessorButton) assessorButton.dataset.responsiveScannerOnly = 'true';\n  ensureAssessorFallbackUi();\n  return true;", 1)
          text = text.replace("plannerMap = planner.getMap();\n  injectStyles();", "plannerMap = planner.getMap();\n  injectStyles();\n  ensureAssessorFallbackUi();", 1)
          text = text.replace("injectCard();\n    scheduleApplyColors(20);", "injectCard();\n    ensureAssessorFallbackUi();\n    scheduleApplyColors(20);", 1)
          file.write_text(text, encoding='utf-8')

          path = 'territories/assessor-scan-direct.js'
          replace_once(path, "const SCAN_VERSION = 'territories-20261010-13';", "const SCAN_VERSION = 'territories-20261010-14';", 'direct scanner version')
          file = Path(path)
          text = file.read_text(encoding='utf-8')
          marker = 'function wireButton() {'
          if 'async function startDirectScan()' not in text:
              if marker not in text:
                  raise SystemExit('direct scanner wire marker not found')
              text = text.replace(marker, insertion + marker, 1)
          text = text.replace('void runDirectScan();', 'void startDirectScan();', 1)
          if 'globalThis.__denverDirectAssessorScan' not in text:
              ending = 'initialize();'
              if not text.rstrip().endswith(ending):
                  raise SystemExit('direct scanner initialize ending not found')
              export_block = "\nglobalThis.__denverDirectAssessorScan = Object.freeze({ version: SCAN_VERSION, run: startDirectScan, inject: injectControls, wire: wireButton });\nexport { startDirectScan, runDirectScan, injectControls, wireButton };\n\ninitialize();\n"
              text = text.rstrip()[:-len(ending)] + export_block
          file.write_text(text, encoding='utf-8')

          replace_once('territories/territory-flex-grouping-pdf.js', "const FLEX_VERSION = 'territories-20261010-7';", "const FLEX_VERSION = 'territories-20261010-14';", 'PDF module version')
          for path in ['territories/bootstrap.js', 'territories/index.html']:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              if 'territories-20261010-13' not in text:
                  raise SystemExit(f'version 13 not found in {path}')
              file.write_text(text.replace('territories-20261010-13', 'territories-20261010-14'), encoding='utf-8')
          Path('.github/workflows/patch-territory-v14.yml').unlink()
          PY

      - name: Validate JavaScript
        shell: bash
        run: |
          node --check territories/address-source-merge.js
          node --check territories/assessor-scan-direct.js
          node --check territories/territory-flex-grouping-pdf.js
          node --check territories/bootstrap.js

      - name: Commit repair
        shell: bash
        run: |
          git config user.name 'LETDesignWorks'
          git config user.email 'michael@letdw.com'
          git add -A
          git commit -m 'Add assessor scan fallback and refresh duplex PDFs'
          git push origin main
