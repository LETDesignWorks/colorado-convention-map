name: Verify territory address duplicate checks
on:
  push:
    branches: [work/duplicate-address-review-42]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/duplicate-address-review-42
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh selected version after cleanup
        run: python .github/updates42/refresh.py
      - name: Install pinned test dependencies
        run: npm install --no-save --package-lock=false --ignore-scripts @turf/turf@7.2.0 jsdom@26.1.0 leaflet@1.9.4 leaflet-draw@1.0.4
      - name: Syntax and regression checks
        run: |
          for f in territories/*.js; do node --check "$f"; done
          node --test tests/saved-work-model.test.mjs tests/saved-work-integration.test.mjs tests/meeting-place-flow.test.mjs tests/meeting-place-scanner.test.mjs tests/meeting-place-ui.test.mjs tests/backup-merge-model.test.mjs tests/backup-merge-service.test.mjs tests/backup-merge-ui.test.mjs tests/library-management.test.mjs tests/library-release.test.mjs tests/meeting-session.test.mjs tests/address-duplicates.test.mjs tests/address-duplicates-flow.test.mjs > /tmp/duplicate-tests.log 2>&1 || { cat /tmp/duplicate-tests.log; exit 1; }
          tail -12 /tmp/duplicate-tests.log
      - name: Commit tested source to review branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add territories tests
          git diff --cached --stat
          git commit -m 'Display cleaned current-session territory after duplicate repair'
          git push origin HEAD:refs/heads/work/duplicate-address-review-42
          git rev-parse HEAD
