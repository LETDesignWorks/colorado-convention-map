name: Patch territory planner workflow and scan v12

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-territory-v12.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch territory planner
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match in {path}, found {count}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          # 1) Make imported-file recognition consistent, keep the scan button clickable,
          # and force Addresses to Avoid directly below the assessor/GIS section.
          path = 'territories/address-source-merge.js'
          replace_once(path,
              "const SOURCE_VERSION = 'territories-20261010-8';",
              "const SOURCE_VERSION = 'territories-20261010-12';",
              'address source version')

          replace_once(path,
          """function isUploadedAddress(house) {
            if (!house) return false;
            if (house.bulkImported || house.bulkBatchId) return true;
            if (Array.isArray(house.bulkBatchIds) && house.bulkBatchIds.some(Boolean)) return true;
            const source = `${house.source || ''} ${house.classification || ''}`.toLowerCase();
            return source.includes('bulk address workset') || source.includes('imported address workset') || source.includes('prepared address list');
          }""",
          """function isUploadedAddress(house) {
            if (!house) return false;
            if (house.bulkImported || house.bulkBatchId) return true;
            if (Array.isArray(house.bulkBatchIds) && house.bulkBatchIds.some(Boolean)) return true;
            const source = `${house.source || ''} ${house.classification || ''}`.toLowerCase();
            return source.includes('bulk address workset') ||
              source.includes('imported address workset') ||
              source.includes('prepared address list') ||
              source.includes('imported csv') ||
              source.includes('imported geojson') ||
              source.includes('uploaded address') ||
              source.includes('classification imported') ||
              clean(house.classification).toLowerCase() === 'imported';
          }""",
          'uploaded recognition')

          replace_once(path,
          """function syncCardVisibility() {
            const bulkCard = document.getElementById('bulkAddressCard');
            const card = document.getElementById('addressSourceMergeCard');
            if (!bulkCard || !card) return;
            card.classList.toggle('territory-workflow-hidden', bulkCard.classList.contains('territory-workflow-hidden'));
          }""",
          """function placeAvoidAfterAssessor() {
            const card = document.getElementById('addressSourceMergeCard');
            const avoidCard = document.getElementById('avoidWorkflowCard');
            if (card && avoidCard && card.nextElementSibling !== avoidCard) {
              card.insertAdjacentElement('afterend', avoidCard);
            }
          }
          function syncCardVisibility() {
            const bulkCard = document.getElementById('bulkAddressCard');
            const card = document.getElementById('addressSourceMergeCard');
            if (!bulkCard || !card) return;
            card.classList.toggle('territory-workflow-hidden', bulkCard.classList.contains('territory-workflow-hidden'));
            placeAvoidAfterAssessor();
          }""",
          'avoid layout')

          replace_once(path,
              "if (button && !scanBusy) button.disabled = !planner?.isAdmin?.() || !counts.uploaded;",
              "if (button && !scanBusy) { button.disabled = !planner?.isAdmin?.(); button.title = counts.uploaded ? 'Add official assessor/GIS addresses around the uploaded list.' : 'Upload or load an address file first; selecting the button will explain what is missing.'; }",
              'scan button state')

          replace_once(path,
              "if (document.getElementById('addressSourceMergeCard')) return true;",
              "if (document.getElementById('addressSourceMergeCard')) { placeAvoidAfterAssessor(); return true; }",
              'existing card layout')

          replace_once(path,
              "bulkCard.insertAdjacentElement('afterend', card);\n  const assessorButton",
              "bulkCard.insertAdjacentElement('afterend', card);\n  placeAvoidAfterAssessor();\n  const assessorButton",
              'new card layout')

          # 2) Make the assessor button use both direct and delegated click wiring,
          # and recognize older CSV/GeoJSON imports as uploaded homes.
          path = 'territories/assessor-scan-responsive.js'
          replace_once(path,
              "const SCAN_VERSION = 'territories-20261010-11';",
              "const SCAN_VERSION = 'territories-20261010-12';",
              'scanner version')

          replace_once(path,
          """function validCoordinates(item) {
            if (planner?.validMapCoordinates) return planner.validMapCoordinates(item);
            const lat = Number(item?.lat), lng = Number(item?.lng);
            return Number.isFinite(lat) && Number.isFinite(lng) && lat >= -90 && lat <= 90 && lng >= -180 && lng <= 180 && !(Math.abs(lat) < 1 && Math.abs(lng) < 1);
          }""",
          """function validCoordinates(item) {
            if (planner?.validMapCoordinates) return planner.validMapCoordinates(item);
            const lat = Number(item?.lat), lng = Number(item?.lng);
            return Number.isFinite(lat) && Number.isFinite(lng) && lat >= -90 && lat <= 90 && lng >= -180 && lng <= 180 && !(Math.abs(lat) < 1 && Math.abs(lng) < 1);
          }
          function isUploadedAddress(house) {
            if (!house) return false;
            if (house.bulkImported || house.bulkBatchId) return true;
            if (Array.isArray(house.bulkBatchIds) && house.bulkBatchIds.some(Boolean)) return true;
            const text = `${house.source || ''} ${house.classification || ''}`.toLowerCase();
            return text.includes('bulk address workset') ||
              text.includes('imported address workset') ||
              text.includes('prepared address list') ||
              text.includes('imported csv') ||
              text.includes('imported geojson') ||
              text.includes('uploaded address') ||
              clean(house.classification).toLowerCase() === 'imported';
          }""",
          'scanner uploaded recognition')

          replace_once(path,
              "const uploaded = planner.getHouses().filter(house => (house.bulkImported || house.bulkBatchId || (Array.isArray(house.bulkBatchIds) && house.bulkBatchIds.length)) && validCoordinates(house));",
              "const uploaded = planner.getHouses().filter(house => isUploadedAddress(house) && validCoordinates(house));",
              'scanner uploaded filter')

          replace_once(path,
          """function interceptScan(event) {
            const button = event.target.closest?.('#addAssessorAddressesButton');
            if (!button) return;
            event.preventDefault();
            event.stopPropagation();
            event.stopImmediatePropagation();
            runResponsiveScan();
          }

          async function initialize() {""",
          """function wireScanButton() {
            const button = document.getElementById('addAssessorAddressesButton');
            if (!button) return false;
            button.dataset.responsiveScannerReady = 'true';
            if (!scanRunning) button.disabled = !planner?.isAdmin?.();
            if (button.dataset.responsiveScannerBound !== 'true') {
              button.dataset.responsiveScannerBound = 'true';
              button.addEventListener('click', event => {
                event.preventDefault();
                runResponsiveScan();
              });
            }
            return true;
          }
          function interceptScan(event) {
            const button = event.target.closest?.('#addAssessorAddressesButton');
            if (!button) return;
            event.preventDefault();
            event.stopPropagation();
            event.stopImmediatePropagation();
            runResponsiveScan();
          }

          async function initialize() {""",
          'direct scan wiring')

          replace_once(path,
          """  document.addEventListener('click', interceptScan, true);
            console.info(`Denver 2027 responsive assessor/GIS scanner loaded (${SCAN_VERSION}).`);""",
          """  wireScanButton();
            document.addEventListener('click', interceptScan, true);
            window.addEventListener('territory-planner:data', () => {
              if (!scanRunning) wireScanButton();
            });
            setButtonState(false);
            console.info(`Denver 2027 responsive assessor/GIS scanner loaded (${SCAN_VERSION}).`);""",
          'scanner initialize wiring')

          # 3) Auto-name new worksets from the selected Kingdom Hall or meeting point.
          path = 'territories/bulk-addresses.js'
          replace_once(path,
              "let api, map, pending = [], unresolved = [], activeBatchId = '', manualDrawer = null;",
              "let api, map, pending = [], unresolved = [], activeBatchId = '', manualDrawer = null;\nlet autoWorksetName = '', worksetNameManuallyEdited = false;",
              'workset state')

          replace_once(path,
          """function refreshContext(){const context=selectedContext();if(el.context){el.context.textContent=contextReady()?`Addresses will be mapped under ${context.hall.markerLabel||context.hall.number||'KH'} — ${context.hall.name||'Kingdom Hall'} • ${context.congregation}.`:'Select a Kingdom Hall and congregation in Area Setup before importing.';}if(el.read)el.read.disabled=!api?.isAdmin?.()||!contextReady();}""",
          """function suggestedWorksetName(context=selectedContext()){return clean(context.hall?.name||context.hall?.markerLabel||context.hall?.number||'');}
          function refreshContext(){const context=selectedContext();const suggested=suggestedWorksetName(context);if(el.context){el.context.textContent=contextReady()?`Addresses will be mapped under ${context.hall.markerLabel||context.hall.number||'KH'} — ${context.hall.name||'Kingdom Hall'} • ${context.congregation}.`:'Select a Kingdom Hall and congregation in Area Setup before importing.';}if(el.name&&suggested){const current=clean(el.name.value);if(!worksetNameManuallyEdited||!current||current===autoWorksetName){el.name.value=suggested;el.name.dataset.autoWorksetName='true';autoWorksetName=suggested;worksetNameManuallyEdited=false;}}if(el.read)el.read.disabled=!api?.isAdmin?.()||!contextReady();}""",
          'workset auto name')

          replace_once(path,
              "if(!clean(el.name.value))el.name.value=(file?.name||'Prepared address list').replace(/\\.[^.]+$/,'').replace(/[_-]+/g,' ');",
              "if(!clean(el.name.value)){const suggested=suggestedWorksetName();el.name.value=suggested||(file?.name||'Prepared address list').replace(/\\.[^.]+$/,'').replace(/[_-]+/g,' ');autoWorksetName=el.name.value;worksetNameManuallyEdited=false;}",
              'workset read fallback')

          replace_once(path,
              "function wire(){el.read.onclick=readList;",
              "function wire(){el.name.addEventListener('input',()=>{worksetNameManuallyEdited=clean(el.name.value)!==autoWorksetName;el.name.dataset.autoWorksetName=worksetNameManuallyEdited?'false':'true';});el.read.onclick=readList;",
              'workset input wiring')

          # 4) Cache-bust every territory module.
          for path in ['territories/bootstrap.js', 'territories/index.html']:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              if 'territories-20261010-11' not in text:
                  raise SystemExit(f'version 11 not found in {path}')
              file.write_text(text.replace('territories-20261010-11', 'territories-20261010-12'), encoding='utf-8')

          # Remove this one-time workflow in the same commit.
          Path('.github/workflows/patch-territory-v12.yml').unlink()
          PY

      - name: Validate JavaScript
        shell: bash
        run: |
          node --check territories/address-source-merge.js
          node --check territories/assessor-scan-responsive.js
          node --check territories/bulk-addresses.js
          node --check territories/bootstrap.js

      - name: Commit repair
        shell: bash
        run: |
          git config user.name 'LETDesignWorks'
          git config user.email 'michael@letdw.com'
          git add -A
          git commit -m 'Repair assessor button and territory import workflow'
          git push origin main
