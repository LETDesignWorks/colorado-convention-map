name: Run corrected territory assessor fallback patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-territory-v14-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Run corrected patch script
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/patch-territory-v14.yml')
          text = workflow.read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = text.index(start_marker) + len(start_marker)
          end = text.index(end_marker, start)
          lines = text[start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines)
          script = script.replace("const FLEX_VERSION = 'territories-20261010-7';", "const FLEX_VERSION = 'territories-20261010-13';")
          exec(compile(script, 'territory-v14-patch.py', 'exec'), {})
          Path('.github/workflows/run-territory-v14-fix.yml').unlink()
          PY

      - name: Validate JavaScript
        shell: bash
        run: |
          node --check territories/address-source-merge.js
          node --check territories/assessor-scan-direct.js
          node --check territories/territory-flex-grouping-pdf.js
          node --check territories/bootstrap.js

      - name: Commit repair
        shell: bash
        run: |
          git config user.name 'LETDesignWorks'
          git config user.email 'michael@letdw.com'
          git add -A
          git commit -m 'Add assessor scan fallback and refresh duplex PDFs'
          git push origin main
