name: Add territory directions

on:
  push:
    paths:
      - '.github/workflows/add-territory-directions.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add Hall and meeting-point directions to territories
        run: python .github/scripts/add_territory_directions.py

      - name: Validate territory directions update
        run: |
          node --check territories/app-main.js
          node --check territories/directions.js
          node --check territories/bootstrap.js
          grep -q 'id="territoryDirectionsCard"' territories/template.html
          grep -q 'id="territoryRouteOrigin"' territories/template.html
          grep -q 'id="territoryMeetingPointList"' territories/template.html
          grep -q 'function emitPlannerDataChange' territories/app-main.js
          grep -q '__denverTerritoryPlannerAPI' territories/app-main.js
          grep -q "directions.js?v=territories-20260927-7" territories/bootstrap.js
          grep -q 'territories-20260927-7' territories/index.html
          grep -q 'territory-route-origin' territories/directions.js
          grep -q 'Show Route on Streets' territories/directions.js

      - name: Commit territory directions update
        run: |
          git config user.name 'LETDesignWorks'
          git config user.email 'michael@letdw.com'
          git add territories/app-main.js territories/template.html territories/styles.css territories/bootstrap.js territories/index.html territories/directions.js
          git commit -m 'Add directions from Halls and meeting points to territories' || exit 0
          git push
