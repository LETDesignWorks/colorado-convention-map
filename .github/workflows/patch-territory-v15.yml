name: Patch territory assessor source fallback v15

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-territory-v15.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Route failed Douglas queries to statewide address source
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('territories/assessor-scan-direct.js')
          text = path.read_text(encoding='utf-8')

          old = """function sourceKeyForHall() {
            const selected = clean(document.getElementById('sourceSelect')?.value);
            if (selected && !['auto', 'manual'].includes(selected) && ASSESSOR_SOURCES[selected]) return selected;
            const hall = planner?.getSelectedHall?.();
            const inferred = hall?.id ? inferSourceForHall(hall.id) : '';
            return ASSESSOR_SOURCES[inferred] ? inferred : 'colorado';
          }"""
          new = """function sourceKeyForHall() {
            const selected = clean(document.getElementById('sourceSelect')?.value);
            if (selected && !['auto', 'manual'].includes(selected) && ASSESSOR_SOURCES[selected]) {
              // The Douglas County layer currently returns ArcGIS error 400
              // (Failed to execute query) for spatial-envelope requests. Use the
              // official statewide composite, which contains Douglas County addresses.
              return selected === 'douglas' ? 'colorado' : selected;
            }
            const hall = planner?.getSelectedHall?.();
            const inferred = hall?.id ? inferSourceForHall(hall.id) : '';
            if (inferred === 'douglas') return 'colorado';
            return ASSESSOR_SOURCES[inferred] ? inferred : 'colorado';
          }"""
          if text.count(old) != 1:
              raise SystemExit(f'Expected one sourceKeyForHall block, found {text.count(old)}')
          text = text.replace(old, new, 1)

          # Improve the status text so the user can see that the statewide source is intentional.
          old_message = "setMessage('The scan button is working. Preparing one small official GIS request…', 'working');"
          new_message = "setMessage('The scan button is working. Preparing one small official GIS request. Douglas County locations automatically use the Colorado statewide address composite because the county layer is currently rejecting map-envelope queries.', 'working');"
          if text.count(old_message) != 1:
              raise SystemExit(f'Expected one scan-start message, found {text.count(old_message)}')
          text = text.replace(old_message, new_message, 1)
          path.write_text(text, encoding='utf-8')

          # Force every browser to load the corrected scanner and related modules.
          files = [
              'territories/assessor-scan-direct.js',
              'territories/address-source-merge.js',
              'territories/territory-flex-grouping-pdf.js',
              'territories/bootstrap.js',
              'territories/index.html',
          ]
          for filename in files:
              file = Path(filename)
              value = file.read_text(encoding='utf-8')
              if 'territories-20261010-14' in value:
                  value = value.replace('territories-20261010-14', 'territories-20261010-15')
              file.write_text(value, encoding='utf-8')

          # Remove temporary debugging and this one-time patch workflow.
          for filename in [
              '.github/workflows/inspect-territory-data.yml',
              '.github/workflows/patch-territory-v15.yml',
          ]:
              file = Path(filename)
              if file.exists():
                  file.unlink()
          PY

      - name: Validate JavaScript
        run: |
          node --check territories/assessor-scan-direct.js
          node --check territories/address-source-merge.js
          node --check territories/territory-flex-grouping-pdf.js
          node --check territories/bootstrap.js

      - name: Commit corrected scanner
        run: |
          git config user.name 'LETDesignWorks'
          git config user.email 'michael@letdw.com'
          git add -A
          git commit -m 'Use statewide address source when Douglas GIS query fails'
          git push origin main
