name: Check Travel Routes
on:
  push:
    paths: ['assets/rail-meeting-points.mjs', 'assignments/**', 'activity-planning/**', 'assets/travel-register*', 'assets/planning.css', 'tests/visual-planning.test.mjs', 'tests/assignment-unassign-focus.test.mjs', 'tests/assignment-locations.test.mjs', 'security/visual-planning-ui.test.mjs', 'assets/landmark-markers.mjs', 'assets/landmarks/**', 'travel-routes/**', 'planning-map/**', 'assets/rail-network.mjs', 'assets/planning-*.mjs', 'data/rtd-rail.json', 'tests/travel-routes.test.mjs', 'tests/travel-controls.test.mjs', 'security/travel-ui.test.mjs', 'security/navigation.test.mjs', '.github/workflows/check-travel-routes.yml']
  workflow_dispatch:
jobs:
  travel-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/travel-routes.test.mjs tests/travel-controls.test.mjs tests/visual-planning.test.mjs tests/assignment-unassign-focus.test.mjs tests/assignment-locations.test.mjs
      - run: npm install --no-audit --no-fund
        working-directory: security
      - run: node --test security/navigation.test.mjs security/travel-ui.test.mjs security/visual-planning-ui.test.mjs

