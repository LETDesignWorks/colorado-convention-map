name: Check Travel Routes
on:
  push:
    paths: ['tests/nearby-parking.test.mjs', 'security/nearby-parking-ui.test.mjs', 'tests/daily-hosting.test.mjs', 'security/daily-hosting-ui.test.mjs', 'convention-center/**', 'tests/convention-center.test.mjs', 'security/convention-center-ui.test.mjs', 'tests/bus-groups.test.mjs', 'security/bus-groups-ui.test.mjs', 'tests/staggered-buses.test.mjs', 'security/staggered-buses-ui.test.mjs', 'tests/activity-planning.mjs', 'tests/activity-service-reach.test.mjs', 'security/activity-service-reach-ui.test.mjs', 'tests/assignment-travel-override.test.mjs', 'tests/meeting-ranking.test.mjs', 'security/meeting-ranking-ui.test.mjs', 'delegate-counts/**', 'tests/delegate-counts.test.mjs', 'security/delegate-counts-ui.test.mjs', 'assets/meeting-suitability*', 'assets/bus-access-status-sync.js', 'tests/meeting-suitability.test.mjs', 'security/meeting-suitability-ui.test.mjs', 'assets/rail-meeting-points.mjs', 'assignments/**', 'activity-planning/**', 'assets/travel-register*', 'assets/planning.css', 'tests/visual-planning.test.mjs', 'tests/assignment-unassign-focus.test.mjs', 'tests/assignment-locations.test.mjs', 'tests/assignment-report-*', 'security/assignment-report-ui.test.mjs', 'security/visual-planning-ui.test.mjs', 'assets/landmark-markers.mjs', 'assets/landmarks/**', 'travel-routes/**', 'planning-map/**', 'assets/rail-network.mjs', 'assets/planning-*.mjs', 'data/rtd-rail.json', 'tests/travel-routes.test.mjs', 'tests/travel-controls.test.mjs', 'security/travel-ui.test.mjs', 'security/navigation.test.mjs', '.github/workflows/check-travel-routes.yml']
  workflow_dispatch:
jobs:
  travel-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/nearby-parking.test.mjs tests/daily-hosting.test.mjs tests/convention-center.test.mjs tests/bus-groups.test.mjs tests/activity-planning.mjs tests/staggered-buses.test.mjs tests/activity-service-reach.test.mjs tests/assignment-travel-override.test.mjs tests/meeting-ranking.test.mjs tests/delegate-counts.test.mjs tests/meeting-suitability.test.mjs tests/travel-routes.test.mjs tests/travel-controls.test.mjs tests/visual-planning.test.mjs tests/assignment-unassign-focus.test.mjs tests/assignment-locations.test.mjs tests/assignment-report-*.test.mjs
      - run: npm install --no-audit --no-fund
        working-directory: security
      - run: node --test security/nearby-parking-ui.test.mjs security/daily-hosting-ui.test.mjs security/convention-center-ui.test.mjs security/bus-groups-ui.test.mjs security/staggered-buses-ui.test.mjs security/activity-service-reach-ui.test.mjs security/meeting-ranking-ui.test.mjs security/delegate-counts-ui.test.mjs security/meeting-suitability-ui.test.mjs security/navigation.test.mjs security/travel-ui.test.mjs security/visual-planning-ui.test.mjs security/assignment-report-ui.test.mjs

      - name: Verify live parking lookup for this feature branch
        if: github.ref == 'refs/heads/codex/rtd-parking-20261122'
        run: |
          node --input-type=module <<'NODE'
          import {createParkingSearch} from './assignments/parking-model.mjs';
          try { const r=await createParkingSearch().search({lat:39.6281,lng:-104.9048}); console.log(JSON.stringify({places:r.places.length,restricted:r.restricted,sample:r.places.slice(0,2)})); if(!r.places.length)process.exitCode=1; } catch(e) { console.error(e); process.exitCode=1; }
          NODE
