name: Verify Bus Review traffic layouts
on:
  push:
    branches: [work/bus-traffic-layouts-46]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned test dependencies
        run: npm install --no-save --package-lock=false --ignore-scripts jsdom@26.1.0 leaflet@1.9.4 playwright@1.51.1
      - name: Syntax and traffic drawing regression tests
        run: |
          node --check bus-access/app-v2.js
          node --check bus-access/traffic-model.mjs
          node --check bus-access/traffic-planner.mjs
          node --test tests/bus-traffic.test.mjs tests/bus-traffic-ui.test.mjs > /tmp/results.log 2>&1 || { grep -A 35 '^not ok' /tmp/results.log; tail -12 /tmp/results.log; exit 1; }
          tail -12 /tmp/results.log
      - name: Desktop and phone browser drawing checks
        run: CHROME_PATH=$(which google-chrome || which chromium) node tests/bus-traffic-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: traffic-layout-preview
          path: test-results/traffic
          retention-days: 3
