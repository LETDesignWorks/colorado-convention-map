name: Fix imported address map points

on:
  push:
    paths:
      - '.github/workflows/fix-bulk-address-map-points.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply imported address map repair
        run: python .github/scripts/run_fix_bulk_address_map_points.py
      - name: Validate imported address map repair
        run: |
          node --check territories/app-main.js
          node --check territories/bulk-addresses.js
          node --check territories/hall-address-sets.js
          grep -q "Repair Mapped Locations" territories/bulk-addresses.js
          grep -q "function usableCoordinates" territories/bulk-addresses.js
          grep -q "function validMapCoordinates" territories/app-main.js
          grep -q "territories-20261010-4" territories/bootstrap.js
          grep -q "territories-20261010-4" territories/index.html
      - name: Commit imported address map repair
        run: |
          git config user.name 'LETDesignWorks'
          git config user.email 'michael@letdw.com'
          git add territories/app-main.js territories/bulk-addresses.js territories/hall-address-sets.js territories/bootstrap.js territories/index.html
          git commit -m 'Fix uploaded addresses mapping at zero coordinates' || exit 0
          git push
