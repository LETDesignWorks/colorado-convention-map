name: Decode territory sources

on:
  push:
    paths:
      - '.github/workflows/decode-territory-sources.yml'

permissions:
  contents: write

jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode compressed territory sources
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, gzip

          root = Path('territories')

          def decode_single(src, dst):
              encoded = (root / src).read_text(encoding='utf-8').strip()
              decoded = gzip.decompress(base64.b64decode(encoded)).decode('utf-8')
              (root / dst).write_text(decoded, encoding='utf-8')

          parts = sorted(root.glob('app.payload.part*.txt'))
          encoded = ''.join(path.read_text(encoding='utf-8').strip() for path in parts)
          decoded = gzip.decompress(base64.b64decode(encoded)).decode('utf-8')
          (root / '_decoded_app.js').write_text(decoded, encoding='utf-8')

          decode_single('template.payload.txt', '_decoded_template.html')
          decode_single('styles.payload.txt', '_decoded_styles.css')
          decode_single('data.payload.txt', '_decoded_data.js')
          PY
      - name: Commit decoded sources
        run: |
          git config user.name 'LETDesignWorks'
          git config user.email 'michael@letdw.com'
          git add territories/_decoded_app.js territories/_decoded_template.html territories/_decoded_styles.css territories/_decoded_data.js
          git commit -m 'Temporarily decode territory planner sources for enhancement work' || exit 0
          git push
