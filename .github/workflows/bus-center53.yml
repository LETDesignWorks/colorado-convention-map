name: Verify Bus Review convention center
on:
  push:
    branches: [work/bus-convention-center-53]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Apply scoped reference-point update
        run: |
          python - <<'PY'
          import pathlib,hashlib,json,zlib,base64
          s=pathlib.Path('.github/updates53/source.b64').read_text().strip()
          assert hashlib.sha256(s.encode()).hexdigest()=='d4d08a6b5146671585d3f2b3098dc68257afe8b6f218ea73e52623435e1b84cb'
          files=json.loads(zlib.decompress(base64.b64decode(s)))
          assert set(files)=={'bus-access/planning-center.mjs','tests/bus-convention-center.test.mjs','.github/updates53/patch.py'}
          for path,content in files.items():
              p=pathlib.Path(path);p.parent.mkdir(parents=True,exist_ok=True);p.write_text(content)
          p=pathlib.Path('tests/bus-traffic-ui.test.mjs')
          s=p.read_text().replace(r'app-v2\.js\?v=traffic-20261023-48',r'app-v2\.js\?v=bus-center-20261023-53').replace(r'app\.js\?v=traffic-20261023-48',r'app\.js\?v=bus-center-20261023-53')
          p.write_text(s)
          PY
          python .github/updates53/patch.py
      - name: Install pinned regression dependencies
        run: npm install --no-save --package-lock=false --ignore-scripts @turf/turf@7.2.0 jsdom@26.1.0 leaflet@1.9.4 leaflet-draw@1.0.4 jspdf@2.5.2
      - name: Validate syntax and run full regression suite
        run: |
          node --check bus-access/app-v2.js
          node --check bus-access/app.js
          node --check bus-access/planning-center.mjs
          node --test tests/*.test.mjs > /tmp/bus-center-tests.log 2>&1 || { grep -A 35 '^not ok' /tmp/bus-center-tests.log; tail -12 /tmp/bus-center-tests.log; exit 1; }
          tail -12 /tmp/bus-center-tests.log
          git diff --exit-code -- bus-access/data.js bus-access/traffic-model.mjs bus-access/traffic-planner.mjs bus-access/traffic-pdf.mjs territories routes route-planner
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: bus-center-tests
          path: /tmp/bus-center-tests.log
          retention-days: 2
      - name: Commit tested code to work branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bus-access tests/bus-convention-center.test.mjs tests/bus-traffic-ui.test.mjs
          git commit -m 'Center Bus Review estimated planning guide on Colorado Convention Center'
          git push origin HEAD:refs/heads/work/bus-convention-center-53
