name: Check planning access rules
on:
  push:
    paths:
      - 'security/**'
      - 'assets/access-model.mjs'
      - 'assets/site-access.mjs'
      - 'assets/site-navigation.*'
      - 'assets/branding.js'
      - '**/*.html'
      - '.github/workflows/check-access-rules.yml'
  workflow_dispatch:
jobs:
  permission-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --no-audit --no-fund
        working-directory: security
      - run: npm test
        working-directory: security
