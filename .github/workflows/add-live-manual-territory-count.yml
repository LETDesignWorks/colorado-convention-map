name: Add live manual territory address count

on:
  push:
    paths:
      - '.github/workflows/add-live-manual-territory-count.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add live address count while drawing and editing territories
        run: python .github/scripts/add_live_manual_territory_count.py

      - name: Validate Territory Planner count update
        run: |
          node --check territories/app-main.js
          node --check territories/bootstrap.js
          grep -q 'id="territoryBoundaryLiveCount"' territories/template.html
          grep -q 'function updateLiveTerritoryBoundaryCount' territories/app-main.js
          grep -q "map.on('draw:drawvertex'" territories/app-main.js
          grep -q "map.on('draw:editvertex'" territories/app-main.js
          grep -q 'territories-20260927-3' territories/bootstrap.js
          grep -q 'territories-20260927-3' territories/index.html

      - name: Commit Territory Planner update
        run: |
          git config user.name 'LETDesignWorks'
          git config user.email 'michael@letdw.com'
          git add territories/app-main.js territories/template.html territories/styles.css territories/bootstrap.js territories/index.html
          git commit -m 'Show live address count while drawing territories' || exit 0
          git push
