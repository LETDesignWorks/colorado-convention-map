name: Verify complete meeting-place sessions
on:
  push:
    branches: [work/complete-meeting-session-41]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/complete-meeting-session-41
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare scoped changes
        run: |
          python - <<'PY'
          import pathlib,base64,zlib,json,hashlib
          encoded=''.join(p.read_text().strip() for p in sorted(pathlib.Path('.github/updates41').glob('bundle*.b64')))
          encoded=encoded.replace('CTPklyq/boVf//WZ8','CTPklyq/boV//WZ8')
          assert hashlib.sha256(encoded.encode()).hexdigest()=='2c49a0c44a15d7ddcc111d3b72f117c786835c4a7af474f490864be0f5a69baa', 'Source transfer checksum mismatch'
          for name,text in json.loads(zlib.decompress(base64.b64decode(encoded))).items():
              p=pathlib.Path(name); p.parent.mkdir(parents=True,exist_ok=True); p.write_text(text)
          PY
          python .github/updates41/patch41.py
          python .github/updates41/followup.py
      - name: Install pinned test dependencies
        run: npm install --no-save --package-lock=false --ignore-scripts @turf/turf@7.2.0 jsdom@26.1.0 leaflet@1.9.4 leaflet-draw@1.0.4
      - name: Syntax and behavior tests
        run: |
          for f in territories/*.js; do node --check "$f"; done
          node --test tests/saved-work-model.test.mjs tests/saved-work-integration.test.mjs tests/meeting-place-flow.test.mjs tests/meeting-place-scanner.test.mjs tests/meeting-place-ui.test.mjs tests/backup-merge-model.test.mjs tests/backup-merge-service.test.mjs tests/backup-merge-ui.test.mjs tests/library-management.test.mjs tests/library-release.test.mjs tests/meeting-session.test.mjs
      - name: Commit tested source to review branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add territories tests
          git diff --cached --stat
          git commit -m 'Unify complete meeting-place session saves and repair boundary editing and membership'
          git push origin HEAD:refs/heads/work/complete-meeting-session-41
          git rev-parse HEAD
