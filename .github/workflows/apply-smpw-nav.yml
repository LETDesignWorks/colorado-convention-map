name: Apply SMPW shared navigation

on:
  push:
    paths:
      - '.github/workflows/apply-smpw-nav.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply SMPW navigation patch
        run: python .github/scripts/add_smpw_nav.py
      - name: Validate navigation and planner
        run: |
          node --check assets/branding.js
          node --check smpw/app.js
          grep -q 'function addSmpwLink' assets/branding.js
      - name: Commit SMPW navigation
        run: |
          git config user.name 'LETDesignWorks'
          git config user.email 'michael@letdw.com'
          git add assets/branding.js
          git commit -m 'Add SMPW planner to shared navigation' || exit 0
          git push
