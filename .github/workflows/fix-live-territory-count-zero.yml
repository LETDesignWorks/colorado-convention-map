name: Fix zero live territory count

on:
  push:
    paths:
      - '.github/workflows/fix-live-territory-count-zero.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Repair live territory counting
        run: python .github/scripts/fix_live_territory_count_zero.py

      - name: Validate Territory Planner repair
        run: |
          node --check territories/app-main.js
          node --check territories/bootstrap.js
          grep -q 'let activeManualTerritoryDrawer = null' territories/app-main.js
          grep -q 'function currentManualTerritoryDraft' territories/app-main.js
          grep -q 'function pointInsideCountGeometry' territories/app-main.js
          grep -Fq 'activeManualTerritoryDrawer?._poly' territories/app-main.js
          grep -q 'territories-20260927-4' territories/bootstrap.js
          grep -q 'territories-20260927-4' territories/index.html

      - name: Commit Territory Planner repair
        run: |
          git config user.name 'LETDesignWorks'
          git config user.email 'michael@letdw.com'
          git add territories/app-main.js territories/bootstrap.js territories/index.html
          git commit -m 'Fix live address counts for manual territory boundaries' || exit 0
          git push
