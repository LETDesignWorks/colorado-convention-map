name: Enable SMPW hubs and route planning

on:
  push:
    paths:
      - '.github/workflows/enable-smpw-hubs-routes.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply SMPW hub and route integration
        run: python .github/scripts/enable_smpw_hubs_routes.py

      - name: Validate SMPW hub and route tools
        run: |
          node --check smpw/app.js
          node --check smpw/enhancements.js
          grep -q '__DENVER2027_SMPW_MAP__' smpw/app.js
          grep -q '__DENVER2027_SMPW_FIREBASE__' smpw/app.js
          grep -q 'enhancements.js?v=smpw-20260926-3' smpw/index.html
          grep -q "recordType: 'smpw-hub'" smpw/enhancements.js
          grep -q 'Drop SMPW Location' smpw/enhancements.js
          grep -q 'RTD / transit' smpw/enhancements.js

      - name: Commit SMPW hub and route integration
        run: |
          git config user.name 'LETDesignWorks'
          git config user.email 'michael@letdw.com'
          git add smpw/app.js smpw/index.html
          git commit -m 'Enable SMPW map drop, hubs, and route directions'
          git push
