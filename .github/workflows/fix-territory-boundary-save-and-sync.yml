name: Fix territory boundary save and home sync

on:
  push:
    paths:
      - '.github/workflows/fix-territory-boundary-save-and-sync.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Repair edited territory boundary saving
        run: python .github/scripts/fix_territory_boundary_save_and_sync.py

      - name: Validate Territory Planner repair
        run: |
          node --check territories/app-main.js
          node --check territories/bootstrap.js
          grep -q 'function applyTerritoryBoundaryAssignments' territories/app-main.js
          grep -q 'function territoryIdFromLayerGroup' territories/app-main.js
          grep -q 'map.on(L.Draw.Event.EDITED, async event' territories/app-main.js
          grep -q 'layer._denverTerritoryId = id' territories/app-main.js
          grep -q 'async function syncTerritoryHomesToBoundary' territories/app-main.js
          grep -q 'async function savePlan(options = {})' territories/app-main.js
          grep -q '>Update Homes</button>' territories/app-main.js
          grep -q 'territories-20260927-5' territories/bootstrap.js
          grep -q 'territories-20260927-5' territories/index.html

      - name: Commit Territory Planner repair
        run: |
          git config user.name 'LETDesignWorks'
          git config user.email 'michael@letdw.com'
          git add territories/app-main.js territories/bootstrap.js territories/index.html
          git commit -m 'Save edited territory boundaries and update homes together' || exit 0
          git push
