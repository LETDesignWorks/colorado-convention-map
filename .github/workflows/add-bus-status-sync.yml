name: Add site-wide bus status colors

on:
  push:
    paths:
      - '.github/workflows/add-bus-status-sync.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Connect all maps to Bus Access Review colors
        run: python .github/scripts/add_bus_status_sync.py

      - name: Validate shared bus-status module and cache versions
        run: |
          node --check assets/bus-access-status-sync.js
          node --check assets/branding.js
          node --check branding.js
          node --check territories/bootstrap.js
          grep -q "bus-access-status-sync.js?v=bus-status-sync-20260927-1" assets/branding.js
          grep -q "assets/bus-access-status-sync.js?v=bus-status-sync-20260927-1" branding.js
          grep -q "assets/branding.js?v=bus-status-sync-20260927-1" index.html
          grep -q "assets/branding.js?v=bus-status-sync-20260927-1" bus-access/index.html
          grep -q "assets/branding.js?v=bus-status-sync-20260927-1" routes/index.html
          grep -q "assets/branding.js?v=bus-status-sync-20260927-1" assignments/index.html
          grep -q "assets/branding.js?v=bus-status-sync-20260927-1" south-dtc-rail/index.html
          grep -q "assets/branding.js?v=bus-status-sync-20260927-1" smpw/index.html
          grep -q "assets/branding.js?v=bus-status-sync-20260927-1" team/seth.html
          grep -q "territories-20260927-2" territories/index.html
          grep -q "bus-status-sync-20260927-1" territories/bootstrap.js

      - name: Commit shared bus-status color update
        run: |
          git config user.name 'LETDesignWorks'
          git config user.email 'michael@letdw.com'
          git add assets/branding.js branding.js '*.html' assignments activities bus-access routes smpw south-dtc-rail team territories
          git commit -m 'Carry bus access approval colors across planning maps' || exit 0
          git push
