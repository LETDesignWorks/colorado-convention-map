name: Fix Firestore boundary storage

on:
  push:
    paths:
      - '.github/workflows/fix-firestore-boundary-storage.yml'
      - '.github/scripts/fix_firestore_boundary_storage.py'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Encode map geometry before saving to Firestore
        run: python .github/scripts/fix_firestore_boundary_storage.py

      - name: Validate the fix
        run: |
          node --check territories/app-main.js
          grep -q 'boundaryJson: encodeGeometry(boundaryGeometry)' territories/app-main.js
          grep -q 'territoriesJson: JSON.stringify' territories/app-main.js
          grep -q 'decodeGeometry(plan.boundaryJson, plan.boundary)' territories/app-main.js
          grep -q 'territories-20260924-3' territories/bootstrap.js
          if grep -q 'boundary: boundaryGeometry,' territories/app-main.js; then
            echo 'Raw nested boundary arrays are still being written.'
            exit 1
          fi

      - name: Commit Firestore storage fix
        run: |
          git config user.name 'LETDesignWorks'
          git config user.email 'michael@letdw.com'
          git add territories/app-main.js territories/bootstrap.js territories/index.html
          git commit -m 'Fix Firestore saving for territory boundaries' || exit 0
          git push
