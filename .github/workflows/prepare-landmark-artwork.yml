name: Prepare landmark artwork
on:
  push:
    branches: ['codex/landmark-pins-20261115']
    paths: ['.github/workflows/prepare-landmark-artwork.yml']
permissions:
  contents: write
jobs:
  artwork:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve public artwork sources
        shell: python
        run: |
          import urllib.request, pathlib, re, html
          root = pathlib.Path('assets/landmarks')
          root.mkdir(parents=True, exist_ok=True)
          dtc = urllib.request.urlopen('https://cdn.freebiesupply.com/logos/large/2x/denver-tech-center-logo-png-transparent.png').read()
          assert dtc[:8] == bytes([137,80,78,71,13,10,26,10]), 'DTC logo download is not PNG'
          (root/'denver-tech-center.png').write_bytes(dtc)
          bear = urllib.request.urlopen('https://drive.google.com/uc?export=download&id=1jQaab-x41gtq0_EhXSebVROE9IY0le55').read()
          assert bear[:3] == bytes([255,216,255]), 'Blue Bear download is not JPEG'
          (root/'blue-bear.jpg').write_bytes(bear)
          print('Verified original Blue Bear JPEG and DTC PNG:', len(bear), len(dtc))
      - name: Save artwork
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/landmarks
          git diff --cached --quiet || git commit -m "Add verified Denver Tech Center district logo"
          git push
