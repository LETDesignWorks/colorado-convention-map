name: Verify territory address review
on:
  push:
    branches: [work/territory-address-review-50]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: tar -czf /tmp/territory-review-source.tgz territories tests assets load-tests/vendor
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: territory-review-source
          path: /tmp/territory-review-source.tgz
          retention-days: 1
