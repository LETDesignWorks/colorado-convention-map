name: Fix SMPW address-autofill conflict

on:
  push:
    paths:
      - '.github/workflows/fix-smpw-autofill-conflict.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename SMPW modal and form IDs
        run: python .github/scripts/fix_smpw_autofill_conflict.py
      - name: Validate SMPW planner
        run: |
          node --check smpw/app.js
          grep -q 'id="smpwLocationModal"' smpw/index.html
          grep -q 'id="smpwLocationForm"' smpw/index.html
          grep -q 'els.smpwLocationModal' smpw/app.js
          ! grep -q 'id="locationModal"' smpw/index.html
      - name: Commit SMPW conflict fix
        run: |
          git config user.name 'LETDesignWorks'
          git config user.email 'michael@letdw.com'
          git add smpw/index.html smpw/app.js
          git commit -m 'Prevent shared address autofill from duplicating SMPW controls'
          git push
