name: Add boundaryless CSV territory maps

on:
  push:
    paths:
      - '.github/workflows/add-boundaryless-csv-map.yml'
      - '.github/scripts/add_boundaryless_csv_map.py'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add CSV address-only mapping mode
        run: python .github/scripts/add_boundaryless_csv_map.py

      - name: Validate CSV address-only mapping
        run: |
          node --check territories/app-main.js
          node --check territories/bulk-addresses.js
          grep -q "CSV mapping option" territories/bulk-addresses.js
          grep -q "addressOnlyMode" territories/app-main.js
          grep -q "Map CSV addresses without an outer boundary" territories/bulk-addresses.js
          grep -q "Select the Kingdom Hall and congregation" territories/bulk-addresses.js
          grep -q "territories-20261010-2" territories/bootstrap.js
          if grep -q "bulkLimit" territories/bulk-addresses.js; then exit 1; fi

      - name: Commit CSV address-only mapping
        run: |
          git config user.name 'LETDesignWorks'
          git config user.email 'michael@letdw.com'
          git add territories/app-main.js territories/bulk-addresses.js territories/bootstrap.js territories/index.html
          git commit -m 'Allow CSV address maps without an outer boundary' || exit 0
          git push
