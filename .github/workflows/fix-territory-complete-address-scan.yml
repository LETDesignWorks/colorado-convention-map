name: Fix territory complete address scan

on:
  push:
    paths:
      - '.github/workflows/fix-territory-complete-address-scan.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove the six-thousand-address cutoff and rescan the primary source
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          app_path = Path('territories/app-main.js')
          app = app_path.read_text(encoding='utf-8')

          old_constants = """const MAX_ADDRESS_RECORDS = 6000;
const FIRESTORE_HOUSE_CHUNK_SIZE = 350;
const HOUSE_LIST_LIMIT = 350;
"""
          new_constants = """const MAX_ADDRESS_RECORDS = 50000;
const ARCGIS_PAGE_SIZE = 1000;
const MAX_ARCGIS_PAGES_PER_TILE = 50;
const FIRESTORE_HOUSE_CHUNK_SIZE = 350;
const HOUSE_LIST_LIMIT = 350;
"""
          if old_constants not in app:
              raise RuntimeError('Address-limit constants anchor was not found.')
          app = app.replace(old_constants, new_constants, 1)

          app = app.replace("resultRecordCount: '1000',", "resultRecordCount: String(ARCGIS_PAGE_SIZE),", 1)

          old_query_pattern = re.compile(r"async function queryArcGisSource\(source, forceGeometry = false\) \{.*?\n\}\nasync function loadParsedSource", re.S)
          new_query = r'''async function queryArcGisSource(source, forceGeometry = false) {
  const features = [];
  const seen = new Set();
  const envelopes = boundaryQueryEnvelopes(source);
  let truncated = false;
  for (let tileIndex = 0; tileIndex < envelopes.length; tileIndex += 1) {
    if (features.length >= MAX_ADDRESS_RECORDS) { truncated = true; break; }
    const envelope = envelopes[tileIndex];
    if (els?.addressMessage) {
      els.addressMessage.textContent = `Loading ${source.label}: area ${tileIndex + 1} of ${envelopes.length} — ${features.length.toLocaleString()} records found…`;
    }
    let offset = 0;
    let tileComplete = false;
    for (let page = 0; page < MAX_ARCGIS_PAGES_PER_TILE; page += 1) {
      const payload = await requestArcGisPage(source, offset, forceGeometry, envelope);
      if (payload?.error) throw new Error(payload.error.message || `${source.label} returned an error.`);
      const pageFeatures = Array.isArray(payload?.features) ? payload.features : [];
      for (const feature of pageFeatures) {
        const key = arcGisFeatureKey(feature);
        if (seen.has(key)) continue;
        seen.add(key);
        features.push(feature);
        if (features.length >= MAX_ADDRESS_RECORDS) { truncated = true; break; }
      }
      if (truncated) break;
      offset += pageFeatures.length;
      const exceeded = Boolean(payload?.exceededTransferLimit);
      if (!exceeded || !pageFeatures.length) { tileComplete = true; break; }
      if (page === MAX_ARCGIS_PAGES_PER_TILE - 1) truncated = true;
    }
    if (!tileComplete && !truncated) truncated = true;
    await new Promise(resolve => setTimeout(resolve, 0));
  }
  if (els?.addressMessage) {
    els.addressMessage.textContent = truncated
      ? `${source.label} reached the ${MAX_ADDRESS_RECORDS.toLocaleString()}-record safety limit. Use a smaller boundary for complete coverage.`
      : `${source.label} scan complete: ${features.length.toLocaleString()} records found across ${envelopes.length} map areas.`;
  }
  return features.slice(0, MAX_ADDRESS_RECORDS);
}
async function loadParsedSource'''
          app, count = old_query_pattern.subn(new_query, app, count=1)
          if count != 1:
              raise RuntimeError(f'queryArcGisSource replacement expected one match, found {count}.')

          old_source_keys = """    const pointSourceKeys = [];
    if (!houses.length && current && current !== 'manual') pointSourceKeys.push(current);
    if (current !== 'colorado') pointSourceKeys.push('colorado');
    else if (inferred && !['manual','colorado'].includes(inferred)) pointSourceKeys.push(inferred);
"""
          new_source_keys = """    const pointSourceKeys = [];
    // Always rescan the primary source. Earlier versions stopped at 6,000 records,
    // which could leave the later map tiles blank even though the county had data.
    if (current && current !== 'manual') pointSourceKeys.push(current);
    if (current !== 'colorado') pointSourceKeys.push('colorado');
    else if (inferred && !['manual','colorado'].includes(inferred)) pointSourceKeys.push(inferred);
"""
          if old_source_keys not in app:
              raise RuntimeError('Gap-fill source-key anchor was not found.')
          app = app.replace(old_source_keys, new_source_keys, 1)

          app = app.replace("button.textContent = 'Checking Sources…';", "button.textContent = 'Scanning Entire Boundary…';", 1)
          app = app.replace("button.textContent = 'Search Other Official Address Sources';", "button.textContent = 'Complete Boundary Scan & Fill Gaps';", 1)

          app_path.write_text(app, encoding='utf-8')

          template_path = Path('territories/template.html')
          template = template_path.read_text(encoding='utf-8')
          template = template.replace(
              'Large boundaries are queried in smaller sections. If the first source is incomplete, use Fill Missing Address Gaps to merge the other official address source and statewide parcel situs addresses without replacing existing work.',
              'Large boundaries are queried in smaller sections and the planner now scans the entire boundary instead of stopping after the first 6,000 records. If the first source is incomplete, use Complete Boundary Scan & Fill Gaps to rescan the primary source and merge the other official address and parcel sources without replacing existing work.'
          )
          template = template.replace('Search Other Official Address Sources</button>', 'Complete Boundary Scan &amp; Fill Gaps</button>', 1)
          template = template.replace(
              'Search the other official address and parcel sources after the first address load.',
              'Use this when dots stop abruptly in one part of the boundary or when known streets are missing. It rescans the primary source and then checks the alternate official address and parcel sources.'
          )
          template_path.write_text(template, encoding='utf-8')

          new_version = 'territories-20260926-1'
          for path in [Path('territories/bootstrap.js'), Path('territories/index.html')]:
              text = path.read_text(encoding='utf-8')
              text = re.sub(r'territories-\d{8}-\d+', new_version, text)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Validate complete address scan update
        run: |
          node --check territories/app-main.js
          grep -q 'const MAX_ADDRESS_RECORDS = 50000' territories/app-main.js
          grep -q 'MAX_ARCGIS_PAGES_PER_TILE = 50' territories/app-main.js
          grep -q 'Always rescan the primary source' territories/app-main.js
          grep -q 'Complete Boundary Scan &amp; Fill Gaps' territories/template.html
          grep -q 'territories-20260926-1' territories/bootstrap.js

      - name: Commit complete address scan update
        run: |
          git config user.name 'LETDesignWorks'
          git config user.email 'michael@letdw.com'
          git add territories/app-main.js territories/template.html territories/bootstrap.js territories/index.html
          git commit -m 'Scan complete territory boundaries for all available addresses'
          git push
