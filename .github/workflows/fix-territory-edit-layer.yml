name: Fix territory edit layer

on:
  push:
    paths:
      - '.github/workflows/fix-territory-edit-layer.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch territory edit geometry handling
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64

          path = Path('territories/app-main.js')
          text = path.read_text(encoding='utf-8')
          old_save = base64.b64decode('').decode()
          new_save = base64.b64decode('').decode()
          old_layer = base64.b64decode('').decode()
          new_layer = base64.b64decode('').decode()
          if old_save not in text or old_layer not in text:
              raise SystemExit('Expected territory edit blocks were not found')
          text = text.replace(old_save, new_save, 1).replace(old_layer, new_layer, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Validate and commit
        run: |
          node --check territories/app-main.js
          git config user.name 'LETDesignWorks'
          git config user.email 'michael@letdw.com'
          git add territories/app-main.js
          git commit -m 'Fix editable territory polygon handles' || exit 0
          git push
