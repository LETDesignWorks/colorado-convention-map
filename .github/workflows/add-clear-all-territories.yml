name: Add Clear All Territories control

on:
  push:
    paths:
      - '.github/workflows/add-clear-all-territories.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add Clear All Territories feature
        run: python .github/scripts/add_clear_all_territories.py

      - name: Validate Territory Planner changes
        run: |
          node --check territories/app-main.js
          node --check territories/bootstrap.js
          grep -q 'id="clearAllTerritoriesButton"' territories/template.html
          grep -q 'function clearAllTerritories()' territories/app-main.js
          grep -q "clearAllTerritoriesButton.addEventListener('click', clearAllTerritories)" territories/app-main.js
          grep -q 'territories-20260927-1' territories/bootstrap.js
          grep -q 'territories-20260927-1' territories/index.html

      - name: Commit Territory Planner update
        run: |
          git config user.name 'LETDesignWorks'
          git config user.email 'michael@letdw.com'
          git add territories/app-main.js territories/template.html territories/styles.css territories/bootstrap.js territories/index.html
          git commit -m 'Add Clear All Territories workspace control' || exit 0
          git push
