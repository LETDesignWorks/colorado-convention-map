<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#0b447e"/>
<title>Full Planning Map | Denver 2027</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png"/>
<style>
:root{--navy:#0b447e}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#e8eef4}
body{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
.shell{height:100%;display:grid;grid-template-rows:auto 1fr}
.nav{min-height:58px;background:linear-gradient(135deg,#083a6b,#0b5b9f);color:#fff;display:flex;align-items:center;gap:12px;padding:8px 12px;box-shadow:0 2px 10px #0003;z-index:5}
.brand{min-width:0;flex:1}.brand strong{display:block;font-size:16px;line-height:1.15}.brand span{display:block;font-size:11px;opacity:.88;margin-top:2px}
.btn{min-height:38px;border-radius:10px;padding:8px 12px;text-decoration:none;font-weight:800;font-size:12px;display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;background:#fff;color:var(--navy);border:1px solid #fff}
.full-map-frame{min-height:0;position:relative}.frame{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
@media(max-width:600px){.nav{min-height:54px;padding:7px 8px;gap:7px}.brand strong{font-size:13px}.brand span{display:none}.btn{font-size:10px;padding:7px 9px}}
</style>
<script type="module" src="assets/branding.js?v=circular-20260909-2"></script>
</head>
<body>
<div class="shell">
<header class="nav"><div class="brand"><strong>Denver 2027 Full Planning Map</strong><span>Congregations, international delegate hotels, RTD rail, bus access, and route planning</span></div><a class="btn" href="./">Return to Planning Site</a></header>
<main class="full-map-frame"><iframe class="frame" src="full-map-content.html" title="Full Denver 2027 convention planning map"></iframe></main>
</div>
</body>
</html>
